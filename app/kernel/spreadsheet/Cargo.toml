[package]
name = "ankole_spreadsheet"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Host-neutral spreadsheet documents, canonical operations, and rebase over GridCraft"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

# Upgrading GridCraft means changing this one revision for every crate and
# running the spreadsheet tests, which include the golden round-trip corpus.
[dependencies]
base64-simd = "0.8.0"
gridcraft-calc = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-chart = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-core = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-formula = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-functions = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-numfmt = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "68a4b1a1c3684fa17553ecb2a1f088c75f6a3567" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
