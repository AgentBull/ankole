[package]
name = "wordcraft-fonts"
version = "0.15.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "WordCraft fonts patched for dynamic add_font cache invalidation and deterministic CJK substitution"
publish = false

[lints]
workspace = true

[features]
# Opt-in test harness support; enabling this alone never changes the application database.
test-support = []

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
skrifa = "0.47"
harfrust = "0.13"
wuff = "0.2.9"
brotli-decompressor = "5"
unicode-bidi = "0.3"
unicode-script = "0.5"
log = "0.4"
