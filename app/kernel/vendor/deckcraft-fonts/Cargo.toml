[package]
name = "deckcraft-fonts"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "DeckCraft fonts patched with init_without_system_fonts for deterministic site-wide font isolation"
publish = false

[lints]
workspace = true

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
skrifa = "0.47"
harfrust = "0.13"
unicode-bidi = "0.3"
log = "0.4"
# Last-resort face only (Ubuntu Light); no UI code.
epaint_default_fonts = "0.37"
