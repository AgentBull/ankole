[package]
name = "ankole_presentation_wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "WebAssembly bindings that run Ankole presentation documents in a browser Web Worker"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
ankole_presentation = { path = "../presentation" }
serde = "1.0.229"
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
