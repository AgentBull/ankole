[package]
name = "ankole_kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Shared native kernel helpers for Ankole"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# `bun run lint` runs clippy with `-D warnings`, so each lint in these tables
# fails the gate. The lints below hold on the current tree (clippy 1.97,
# `--all-targets`, with and without `nif`). The remaining lints from the kernel
# review wait until the code is clean; measured hits, most of them in test
# targets: clippy::unwrap_used 717, clippy::expect_used 201,
# clippy::indexing_slicing 822, clippy::cast_possible_truncation 23,
# clippy::large_futures 3, missing_debug_implementations 3.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
allow_attributes_without_reason = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[features]
default = []
nif = ["dep:rustler", "dep:stacker", "universal_ai_client", "brain_markdoc", "object_store", "model_image"]
# Node addon for browser URL policy, checked connections, and token estimates.
# Do not combine with nif.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build", "web_proxy"]
web_proxy = ["dep:tokio"]
brain_markdoc = ["markdown"]
markdown = ["dep:comrak"]
object_store = [
  "dep:bytes",
  "dep:futures-util",
  "dep:opendal",
  "dep:opendal-http-transport-reqwest",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
]
universal_ai_client = [
  "dep:bytes",
  "dep:futures-util",
  "dep:no-proxy",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-socks",
  "dep:tokio-tungstenite",
]
model_image = ["dep:image", "dep:webp"]

[dependencies]
base64-simd = "0.8.0"
blake3 = "1.8.7"
bytes = { version = "1.12.1", optional = true }
cel = "0.15.0"
chacha20poly1305 = "0.11.0"
comrak = { version = "0.57.0", default-features = false, optional = true }
crc32fast = "1.5.3"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
globset = "0.4.20"
hashcrew = { version = "0.3.0", default-features = false, features = ["std", "xxhash"] }
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mimalloc = "0.1.52"
napi = { version = "3.15.0", optional = true }
napi-derive = { version = "3.6.13", optional = true }
no-proxy = { version = "0.3.7", default-features = false, optional = true }
opendal = { version = "0.59.5", default-features = false, features = [
  "services-azblob",
  "services-cos",
  "services-d1",
  "services-s3",
  "services-fs",
  "services-gcs",
  "services-oss",
  "services-postgresql",
  "services-sftp",
  "services-tos",
  "services-webdav",
  "executors-tokio",
  "layers-retry",
  "layers-timeout",
], optional = true }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, optional = true }
rand = { version = "0.10.3", features = ["sys_rng"] }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "zstd", "socks"], optional = true }
rlibphonenumber = "2.2.14"
rustler = { version = "0.39.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sonic-rs = "0.5.10"
stacker = { version = "0.1.25", optional = true }
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-socks = { version = "0.5.3", default-features = false, features = ["tokio"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v7", "fast-rng"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
webp = { version = "0.3.1", default-features = false, optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
incremental = true
