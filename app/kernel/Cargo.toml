[package]
name = "ankole_kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Shared native kernel helpers for Ankole"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true

# The Office crates are host-neutral so that the NIF and the browser builds
# share them; the root package's own dependencies do not build for wasm32.
[workspace]
members = [
  "presentation",
  "presentation-wasm",
  "spreadsheet",
  "spreadsheet-wasm",
  "vendor/deckcraft-fonts",
  "word",
  "word-wasm",
]

# `bun run lint` runs clippy with `-D warnings`, so each lint in these tables
# fails the gate for every workspace member. The lints below hold on the
# current tree (clippy 1.99.1, `--all-targets`, with and without `nif`). The
# remaining lints from the kernel review wait until the code is clean; measured
# hits, most of them in test targets: clippy::unwrap_used 717,
# clippy::expect_used 201, clippy::indexing_slicing 822,
# clippy::cast_possible_truncation 23, clippy::large_futures 3,
# missing_debug_implementations 3.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[features]
default = []
nif = [
  "dep:ankole_presentation",
  "dep:ankole_spreadsheet",
  "dep:ankole_word",
  "dep:rustler",
  "dep:stacker",
  "universal_ai_client",
  "markdown",
  "file_text",
  "object_store",
  "model_image",
  "sql_inspect",
]
# Node addon for browser URL policy, checked connections, and token estimates.
# Do not combine with nif.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build", "web_proxy"]
web_proxy = ["dep:tokio"]
desktop_http = [
  "dep:bytes",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
]
markdown = ["dep:comrak", "dep:serde_yaml_ng"]
file_text = ["dep:lopdf", "dep:zip"]
object_store = [
  "dep:bytes",
  "dep:futures-util",
  "dep:opendal",
  "dep:opendal-http-transport-reqwest",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
]
universal_ai_client = [
  "dep:bytes",
  "dep:futures-util",
  "dep:no-proxy",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-socks",
  "dep:tokio-tungstenite",
]
# Custom root CA certificate field on `TransportSpec` for local TLS test fixtures.
test-ca = []
model_image = ["dep:image", "dep:webp"]
sql_inspect = ["dep:sqlparser", "dep:stacker"]

[dependencies]
ankole_presentation = { path = "presentation", optional = true }
ankole_spreadsheet = { path = "spreadsheet", optional = true }
ankole_word = { path = "word", optional = true }
any_ascii = "0.3.3"
base64-simd = "0.8.0"
blake3 = "1.8.7"
bytes = { version = "1.12.1", optional = true }
cel = "0.15.0"
chacha20poly1305 = "0.11.0"
comrak = { version = "0.59.0", default-features = false, optional = true }
crc32fast = "1.5.4"
csv = "1.4.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
globset = "0.4.21"
hashcrew = { version = "0.3.0", default-features = false, features = ["std", "xxhash"] }
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lopdf = { version = "0.47.0", default-features = false, optional = true }
# BEAM loads the NIF at runtime with dlopen, so mimalloc must use local-dynamic
# TLS instead of initial-exec static TLS on Unix.
mimalloc = { version = "0.1.52", features = ["local_dynamic_tls"] }
napi = { version = "3.16.1", optional = true }
napi-derive = { version = "3.7.0", optional = true }
no-proxy = { version = "0.3.7", default-features = false, optional = true }
opendal = { version = "0.59.5", default-features = false, features = [
  "services-azblob",
  "services-cos",
  "services-d1",
  "services-s3",
  "services-fs",
  "services-gcs",
  "services-oss",
  "services-postgresql",
  "services-sftp",
  "services-tos",
  "services-webdav",
  "executors-tokio",
  "layers-retry",
  "layers-timeout",
], optional = true }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, optional = true }
rand = { version = "0.10.3", features = ["sys_rng"] }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "zstd", "socks"], optional = true }
rlibphonenumber = "2.2.15"
rustler = { version = "0.39.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
serde_yaml_ng = { version = "0.10.0", optional = true }
sonic-rs = "0.5.10"
sqlparser = { version = "0.63.0", features = ["visitor"], optional = true }
stacker = { version = "0.1.25", optional = true }
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-socks = { version = "0.5.3", default-features = false, features = ["tokio"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v7", "fast-rng"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
webp = { version = "0.3.1", default-features = false, optional = true }
zip = { version = "9.4.2", default-features = false, features = ["deflate"], optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[profile.release]
lto = "thin"

[profile.dev]
debug = "line-tables-only"
incremental = true

# `bun run --filter @ankole/kernel build:wasm` builds the browser spreadsheet
# module with this profile; the NIF keeps the release profile above.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

# Required by craft-pdf and deckcraft-fonts in WordCraft and DeckCraft; both
# engines share one craft-libs revision across the workspace.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }

[patch."https://github.com/storytold/deckcraft"]
deckcraft-fonts = { path = "vendor/deckcraft-fonts" }
