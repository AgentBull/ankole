[package]
name = "ankole_kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Shared native kernel helpers for Ankole"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[example]]
name = "runtime_fabric_napi_peer"
required-features = ["napi"]

[lints.clippy]
allow_attributes_without_reason = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]
nif_dev = ["dep:rustler", "universal_ai_client_ring", "program_runner", "brain_markdoc"]
nif_prod = ["dep:rustler", "universal_ai_client_http3", "program_runner", "brain_markdoc"]
brain_markdoc = ["dep:comrak"]
program_runner = ["dep:deno_core", "dep:futures-util", "dep:tokio"]
universal_ai_client = [
  "dep:bytes",
  "dep:futures-util",
  "dep:no-proxy",
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-socks",
  "dep:tokio-tungstenite",
]
universal_ai_client_http3 = ["universal_ai_client", "reqwest/http3"]
universal_ai_client_ring = [
  "universal_ai_client",
  "dep:rustls",
  "reqwest/rustls-no-provider",
  "rustls/ring",
]

[dependencies]
any_ascii = "0.3.3"
argon2 = "0.5.3"
base64-simd = "0.8.0"
blake3 = "1.8.7"
bytes = { version = "1.12.1", optional = true }
cel = "0.14.3"
chacha20poly1305 = "0.11.0"
comrak = { version = "0.54.0", default-features = false, optional = true }
crc32fast = "1.5.1"
deno_core = { version = "0.410.0", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
globset = "0.4.20"
hex = "0.4.3"
imara-diff = "0.2.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
mimalloc = "0.1.52"
napi = { version = "3.12.2", default-features = false, features = ["napi10", "serde-json-ordered", "object_indexmap"], optional = true }
napi-derive = { version = "3.6.3", optional = true }
no-proxy = { version = "0.3.7", default-features = false, optional = true }
prost = "0.14.4"
rand = { version = "0.10.2", features = ["sys_rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "stream", "gzip", "brotli", "zstd", "socks"], optional = true }
rlibphonenumber = "2.2.10"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12"], optional = true }
rustler = { version = "0.38.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sonic-rs = "0.5.8"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"], optional = true }
tokio-socks = { version = "0.5.3", default-features = false, features = ["tokio"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4", "v7", "fast-rng"] }
zmq = "0.10.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zstd = "0.13"

[build-dependencies]
napi-build = "2.4.1"
prost-build = "0.14.4"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
incremental = true
