[package]
name = "ankole_kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Shared native kernel helpers for Ankole"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints.clippy]
allow_attributes_without_reason = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"

[features]
default = []
nif = ["dep:rustler", "dep:stacker", "universal_ai_client", "program_runner", "brain_markdoc", "object_store", "model_image"]
brain_markdoc = ["markdown"]
markdown = ["dep:comrak"]
object_store = [
  "dep:bytes",
  "dep:futures-util",
  "dep:opendal",
  "dep:opendal-http-transport-reqwest",
  "dep:reqwest",
  "dep:tokio",
]
program_runner = ["dep:deno_core", "dep:futures-util", "dep:tokio"]
universal_ai_client = [
  "dep:bytes",
  "dep:futures-util",
  "dep:no-proxy",
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-socks",
  "dep:tokio-tungstenite",
]
model_image = ["dep:image", "dep:webp"]

[dependencies]
argon2 = "0.6.0"
base64-simd = "0.8.0"
blake3 = "1.8.7"
bytes = { version = "1.12.1", optional = true }
cel = "0.15.0"
chacha20poly1305 = "0.11.0"
comrak = { version = "0.56.0", default-features = false, optional = true }
crc32fast = "1.5.2"
deno_core = { version = "0.412.0", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
globset = "0.4.20"
hashcrew = { version = "0.3.0", default-features = false, features = ["std", "xxhash"] }
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mimalloc = "0.1.52"
no-proxy = { version = "0.3.7", default-features = false, optional = true }
opendal = { version = "0.59.4", default-features = false, features = [
  "services-azblob",
  "services-cos",
  "services-d1",
  "services-s3",
  "services-fs",
  "services-gcs",
  "services-oss",
  "services-postgresql",
  "services-sftp",
  "services-tos",
  "services-webdav",
  "executors-tokio",
  "layers-retry",
  "layers-timeout",
], optional = true }
opendal-http-transport-reqwest = { version = "0.59.4", default-features = false, optional = true }
rand = { version = "0.10.3", features = ["sys_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "zstd", "socks"], optional = true }
rlibphonenumber = "2.2.13"
rustler = { version = "0.38.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sonic-rs = "0.5.10"
stacker = { version = "0.1.25", optional = true }
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"], optional = true }
tokio-socks = { version = "0.5.3", default-features = false, features = ["tokio"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "v7", "fast-rng"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
webp = { version = "0.3.1", default-features = false, optional = true }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
incremental = true
