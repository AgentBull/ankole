syntax = "proto3";

package ankole.runtime_fabric.v1;

// Business payload messages for RuntimeFabric RPC operations.
//
// `RPCRequest.method` selects the request/response message pair through the
// committed `rpc_methods.json` registry; `RPCRequest.payload` and
// `RPCResponse.payload` carry the binary encoding of these messages. The
// turn fence travels on the RPCRequest frame, and a worker_agent operation
// acts for the Agent of the connection, never for a subject inside these
// payloads. Request correlation is owned by the frame `request_id`, so
// payloads carry no identity or correlation echoes.
//
// Conventions: `bytes *_json` fields are deliberately free-form JSON
// documents where empty bytes mean absent; closed string sets (status,
// kind, access, reasoning_effort) stay strings because the owning domain
// layer validates them; `optional` marks scalars whose absence differs from
// the zero value; timestamps are ISO-8601 strings.

// shared

// Response family whose body is model-facing JSON owned by the Elixir
// broker. The worker parses body_json and passes it through to the model
// unchanged.
message JSONPassthroughResponse {
  bytes body_json = 1;
}

// actor turn completion

// Completion is a terminal write. The turn fence stays on the RPC frame so a
// retry can carry the same durable completion anchor with a new request id.


// A no-op consumes the applied input prefix without provider-visible output.
// It commits through the same completion transaction with outcome `silent`.
// `final_response_id` names the adopted Response when the worker ran a model
// loop; it is empty when the turn produced no gateway Response.


// An abort ends one worker attempt without consuming any Signal input.
message ActorTurnAbortRequest {
  string code = 1;
  string message = 2;
  bytes details_json = 3;
}

message ActorTurnAbortResponse {
  reserved 2;
  reserved "dead_lettered";
  string retry_available_at = 3;
}

// worker_agent scope

message AIGatewayAPIKeyRequest {}

message AIGatewayAPIKeyResponse {
  string api_key = 2;
  string token_type = 3;
  // Unix seconds.
  int64 expires_at = 4;
  int64 expires_in = 5;
  string scope = 6;
  string base_url = 7;
}

message WorkerEnvResolveRequest {
  string binding_name = 1;
}

message WorkerEnvResolveResponse {
  map<string, string> vars = 1;
  map<string, string> operator_vars = 2;
  map<string, string> binding_vars = 3;
}

message ObservabilitySpansExportRequest {
  bytes payload = 1;
}

message ObservabilitySpansExportResponse {}

// Drive files of the Agent. A drive path is relative and uses `/`.
// `home_relative_path` names a file in the calling Worker's Agent Home; the
// control plane moves its bytes over the WorkerFiles relay of that Worker.
message DriveFile {
  string path = 1;
  string sha256 = 2;
  uint64 size = 3;
  string content_type = 4;
  string source = 5; // inbound | generated | sent | agent | console
  uint32 mode = 6;
  string updated_at = 7;
  string conversation_id = 8;
  string message_id = 9;
}

message FilesListRequest {
  string prefix = 1;
  uint32 limit = 2;
  string after = 3;
}

message FilesListResponse {
  repeated DriveFile files = 1;
  string next_after = 2;
  // Digest of the complete folder path, content, and mode manifest.
  string revision = 3;
}

message FilesGetRequest {
  string path = 1;
  string home_relative_path = 2;
  // Read a page-owned path from the Pod drive, authorized as this Agent.
  bool pod_drive = 3;
}

message FilesGetResponse {
  DriveFile file = 1;
}

// Pod domain operations keep their identity in the authenticated turn. The
// broker accepts a closed operation vocabulary and validates each payload.
message PodRequest {
  string operation = 1;
  bytes params_json = 2;
}

// One file to name at `path`. The control plane pulls `home_relative_path`
// unless the Agent's drive already holds the content named by `sha256`.
message FilesCommitUpsert {
  string path = 1;
  string home_relative_path = 2;
  string sha256 = 3;
  string content_type = 4;
  uint32 mode = 5;
  // Size of the local file; the control plane groups transfers by it and
  // checks the bytes it receives.
  uint64 size = 6;
}

message FilesCommitRequest {
  repeated FilesCommitUpsert upserts = 1;
  // Each delete removes the path and every path under it.
  repeated string deletes = 2;
}

message FilesCommitResponse {
  repeated DriveFile files = 1;
  uint32 deleted = 2;
}

// agent conversation context

message ConversationInfo {
  string timezone = 4;
  string drive_directory = 5;
  string page_id = 6;
  string pod_instructions = 7;
}

message RuntimeSkillSummary {
  string skill_name = 1;
  string description = 2;
  string source_kind = 4;            // builtin | installed | open set
  string agent_plugin_id = 5;
  string relative_path = 6;
  string skill_root = 7;             // library | internal | open set
  bytes metadata_json = 8;
  string category = 9;
}

message AgentConversationContextResponse {
  reserved 9, 10, 11, 13;
  reserved "soul_content_hash", "mission_content_hash", "design_content_hash", "confidentiality_policy_content_hash";
  ConversationInfo conversation = 2;
  string soul = 3;
  string mission = 4;
  string design = 5;
  repeated RuntimeSkillSummary skills = 8;
  string confidentiality_policy = 12;
  repeated AgentPluginCatalogEntry agent_plugins = 14;
  // The rendered Skill index of a Job turn; empty for a workspace context.
  string skills_prompt = 15;
}

// agent plugin catalog

message AgentPluginCatalogSkill {
  string catalog_name = 1;
}

message AgentPluginCatalogEntry {
  string id = 1;
  repeated AgentPluginCatalogSkill skills = 5;
}

// background_agent_job

message BackgroundAgentJobGetRequest {
  string job_id = 1;
  string result_offset = 4; // UTF-8 byte offset; empty omits the result window
}

message BackgroundAgentJobTurnUpsertRequest {
  string job_id = 1;
  uint32 attempt = 2;
  string runtime_thread_id = 3;
  string runtime_turn_id = 4;
  string kind = 5;   // agent | compaction
  string status = 6; // in_progress | completed | failed | interrupted
  uint32 revision = 7;
  bytes trajectory_json = 8;
  bytes progress_json = 10;
  bytes usage_json = 11;
  bytes error_json = 12;
  string started_at = 13;
  string completed_at = 14;
  // Ordered sanitized semantic thread items pending checkpoint. The control
  // plane stores them as the one turn content stream and derives the
  // trajectory-group projection from them.
  bytes turn_items_json = 15;
}

// Pages the stored lead-thread turn items of one Job's workspace lineage in
// chronological order. The worker replays them into a replacement Codex
// thread when the native thread state is gone.
message BackgroundAgentJobTurnItemsListRequest {
  string job_id = 1;
  string cursor = 2;
}

message BackgroundAgentJobTurnItem {
  string runtime_thread_id = 1;
  string runtime_turn_id = 2;
  uint32 position = 3;
  string item_key = 4;
  bytes item_json = 5;
}

message BackgroundAgentJobTurnItemsListResponse {
  string job_id = 1;
  repeated BackgroundAgentJobTurnItem items = 2;
  string next_cursor = 3;
}

message BackgroundAgentJobStatusUpdateRequest {
  string job_id = 1;
  string status = 2; // queued | running | waiting_on_user | succeeded | failed | stopped
  string runtime_thread_id = 3;
  bytes result_json = 4;
  bytes error_json = 5;
  bytes metadata_json = 6;
  repeated string applied_signal_ids = 7;
}

message BackgroundAgentJobAttemptHistoryEntry {
  uint32 attempt = 1;
  repeated string turn_statuses = 2;
  string summary = 3;
  repeated string used_skill_names = 4;
}

message BackgroundAgentJobResponse {
  string agent_uid = 2;
  string status = 6;
  string runtime_thread_id = 7;
  string task = 10;
  uint32 attempts = 14;
  string workspace_template_id = 15;
  string continued_from_job_id = 16;
  string workspace_owner_job_id = 17;
  bytes metadata_json = 25;
  // Rich nested execution document rendered for the model.
  repeated BackgroundAgentJobAttemptHistoryEntry attempt_history = 27;
  bytes runtime_projection_json = 29;
  string result_output_text = 31;
  string result_output_total_bytes = 32;
}

message BackgroundAgentJobTurn {
  string id = 1;
  uint32 attempt = 2;
  string runtime_thread_id = 3;
  string runtime_turn_id = 4;
  string kind = 5;
  string status = 6;
  uint32 revision = 7;
  bytes trajectory_json = 8;
  bytes progress_json = 9;
  bytes usage_json = 10;
  bytes error_json = 11;
  string started_at = 12;
  string completed_at = 13;
  string inserted_at = 14;
  string updated_at = 15;
}

message BackgroundAgentJobTurnUpsertResponse {
  string job_id = 1;
  BackgroundAgentJobTurn turn = 2;
}

// webhook endpoint (requests typed, responses model-facing passthrough)

message WebhookEndpointCreateRequest {
  string label = 2;
  string mode = 3; // one_shot | standing
  string expires_at = 4;
  reserved 1, 5;
  string automation_job_id = 6;
}

message WebhookEndpointListRequest {
  optional uint32 limit = 1;
}

message WebhookEndpointTargetRequest {
  string webhook_endpoint_id = 1;
}

// signal channel (requests typed, responses model-facing passthrough)

// automation job

// `drive_prefix` names the drive folder that holds the script and its
// `main.ts`; the Worker copies the directory there before it calls create.
message AutomationJobCreateRequest {
  reserved 1;
  reserved "directory_path";
  string label = 2;
  bool wake_on_failure = 3;
  string drive_prefix = 4;
}

message AutomationJobListRequest {
  optional uint32 limit = 1;
}

message AutomationJobShowRequest {
  string automation_job_id = 1;
  optional uint32 runs = 2;
}

message AutomationJobTargetRequest {
  string automation_job_id = 1;
}

message AutomationJobEmitRequest {
  string automation_job_run_id = 1;
  string attempt_id = 2;
  bytes payload_json = 3;
}

message AutomationJobEmitResponse {}

// Control-plane-originated request handled by the Agent Computer worker.
message AutomationJobRunRequest {
  reserved 4;
  reserved "directory_path";
  string automation_job_run_id = 1;
  string attempt_id = 2;
  string label = 5;
  bytes event_json = 6;
  uint32 timeout_ms = 7;
  string automation_job_id = 8;
  repeated RuntimeSkillSummary skills = 9;
  string binding_name = 10;
  // Drive folder of the script; the Worker copies it to a run directory.
  string drive_prefix = 11;
}

message AutomationJobRunResponse {
  string status = 1; // succeeded | failed
  optional int32 exit_code = 2;
  string error = 3;
  string stdout = 4;
  string stderr = 5;
  bool stdout_truncated = 6;
  bool stderr_truncated = 7;
}

// Control-plane read tools shared by Conversations and Codex Jobs. Browser
// rendering stays on the Worker; its extracted body returns here for the same
// page window and cache rules. Cache fields are disposable, never recovery truth.
message ReadToolRequest {
  string name = 1;
  bytes arguments_json = 2;
  bytes web_cache_json = 3;
  bytes rendered_body_json = 4;
}

// worker files

// Control-plane-originated transfers into or out of the Agent Home of the
// Worker that receives the request; the connection names the Agent.
// File bytes do not travel inside RuntimeFabric: `worker_files.pull` and
// `worker_files.push` carry a one-time relay URL on the control-plane Pod
// that owns the transfer, and the Worker moves the bytes over HTTP.
// `url` is a short-lived bearer credential and must not be logged.
message WorkerFileTransferRequest {
  reserved 3;
  reserved "root";
  string transfer_id = 1;
  string url = 2;
  // A path inside the Agent Home, without the Agent UID.
  string home_relative_path = 4;
  uint64 max_bytes = 5;
  string expires_at = 6;
  // Push only: when set, `home_relative_path` is a directory and the Worker
  // sends these files under it as one bundle. Each entry is a 4-byte
  // big-endian path length, the UTF-8 path relative to that directory, an
  // 8-byte big-endian content length, and the content, in this order.
  repeated string bundle_paths = 7;
}

message WorkerFileTransferResponse {
  reserved 1, 2, 4;
  reserved "root", "relative_path", "xxh3_128";
  uint64 size = 3;
}
