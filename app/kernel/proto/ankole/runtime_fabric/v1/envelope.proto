syntax = "proto3";

package ankole.runtime_fabric.v1;

message ActorKey {
  string agent_uid = 1;
  string session_id = 2;
}

message ActorTurnRef {
  // The control plane checks this fence before accepting worker output. Actor
  // identity, activation, epoch, and the actor-event id identify the run; revision
  // is an exact acceptance guard for first delivery and a monotonic guard across
  // later mailbox/retry updates. One worker execution processes one actor event.
  ActorKey actor = 1;
  string activation_uid = 2;
  uint64 actor_epoch = 3;
  string actor_event_id = 4;
  uint32 revision = 5;
}

enum Lane {
  LANE_UNSPECIFIED = 0;
  LANE_CONTROL = 1;
  LANE_TURN = 2;
  LANE_PROGRESS = 3;
  LANE_RPC = 4;
}

enum DurabilityClass {
  DURABILITY_UNSPECIFIED = 0;
  // CONTROL_* means the control plane owns durable truth, replay, or ephemeral
  // observability for this message. It is not a separate transport lane.
  CONTROL_DURABLE = 1;
  CONTROL_REPLAYABLE = 2;
  CONTROL_EPHEMERAL = 3;
}

message Envelope {
  // Bump only when wire-compatibility changes. Additive fields keep version 1.
  uint32 protocol_version = 1;
  string message_id = 2;
  string correlation_id = 3;
  Lane lane = 5;
  // Host wall-clock metadata for logs and metrics; not a replay or ordering
  // fence.
  int64 sent_at_unix_ms = 6;
  DurabilityClass durability = 7;

  oneof body {
    // Worker lifecycle messages describe homogeneous computer workers. They do
    // not negotiate per-worker features.
    AgentComputerWorkerReady worker_ready = 20;
    AgentComputerWorkerHeartbeat worker_heartbeat = 21;
    AgentComputerWorkerCapacity worker_capacity = 22;
    // Turn messages carry the local computer AI loop contract.
    TurnStart turn_start = 30;
    MailboxUpdated mailbox_updated = 31;
    TurnAccepted turn_accepted = 33;
    TurnControl turn_control = 34;
    WorkerProgress worker_progress = 35;
    TurnError turn_error = 41;
    TurnNoopCompleted turn_noop_completed = 42;
    TurnCompleted turn_completed = 43;
    ControlShutdown control_shutdown = 50;
    RPCRequest rpc_request = 70;
    RPCResponse rpc_response = 71;
    RPCError rpc_error = 72;
  }

}

message AgentComputerWorkerReady {
  string worker_id = 1;
  // Runtime and version are observability metadata. Scheduling assumes workers
  // are equivalent because they boot from the same image.
  string runtime = 2;
  string version = 3;
  bytes capacity_json = 4;
  // Identifies one concrete process lifetime behind the stable worker id.
  string incarnation_id = 5;
}

message AgentComputerWorkerHeartbeat {
  string worker_id = 1;
  // Worker-local monotonic timestamp for observability only. It must not be
  // compared across workers or process restarts.
  int64 monotonic_ms = 2;
  bytes load_json = 3;
  string incarnation_id = 4;
}

message AgentComputerWorkerCapacity {
  string worker_id = 1;
  bytes capacity_json = 2;
  bytes load_json = 3;
  uint32 available_turn_slots = 4;
  string incarnation_id = 5;
}

message ActorEventEnvelope {
  // References the durable actor-event row. One worker execution processes
  // exactly one actor_event_id.
  string actor_event_id = 1;
  uint64 queue_sequence = 2;
  string type = 3;
  string source_event_id = 4;
  string source_entry_id = 5;
  bytes payload_json = 6;
  string binding_name = 7;
  string signal_channel_id = 8;
  string provider_thread_id = 9;
}

message TurnStart {
  // Starts one local computer run for a single actor event.
  ActorTurnRef turn = 1;
  ActorEventEnvelope actor_event = 2;
  TurnModelRef model_ref = 3;
  bytes request_context_json = 4;
  bytes hosted_tools_json = 5;
}

message TurnModelRef {
  string profile = 1;
  string provider_id = 2;
  string model = 3;
  string provider_kind = 4;
  repeated string input_modalities = 5;
  TurnModelRef vision_fallback_model_ref = 6;
  // Provider model output-token ceiling for the worker-side defensive clamp.
  // Absent means the control plane has no limit metadata for this model.
  optional uint32 max_completion_tokens = 7;
}

message MailboxUpdated {
  // Mid-run injections carry exactly one already-journaled actor event.
  string reason = 1;
  ActorTurnRef turn = 2;
  ActorEventEnvelope actor_event = 3;
}

message TurnAccepted {
  // Confirms the delivery revision the worker accepted. Terminal commits may
  // race ahead on the AIGateway path, so acceptance is used to decide which
  // mid-run mailbox events can be completed with the current turn, not as a
  // hard prerequisite for the final commit itself.
  ActorTurnRef turn = 1;
}

message TurnControl {
  ActorTurnRef turn = 1;
  string command = 2;
  bytes payload_json = 3;
}

message WorkerProgress {
  ActorTurnRef turn = 1;
  string kind = 2;
  string summary = 3;
  bytes refs_json = 4;
}

message TurnError {
  ActorTurnRef turn = 1;
  string code = 2;
  string message = 3;
  bytes details_json = 4;
}

message TurnNoopCompleted {
  ActorTurnRef turn = 1;
  string reason = 2;
}

enum TurnCompletionOutcome {
  TURN_COMPLETION_OUTCOME_UNSPECIFIED = 0;
  TURN_COMPLETION_OUTCOME_LOOP_FINISHED = 1;
  TURN_COMPLETION_OUTCOME_ITERATION_EXHAUSTED = 2;
}

message TurnCompleted {
  ActorTurnRef turn = 1;
  string final_response_id = 2;
  TurnCompletionOutcome outcome = 3;
}

message ControlShutdown {
  string reason = 1;
}

message RPCRequest {
  string request_id = 1;
  string method = 2;
  int64 deadline_unix_ms = 3;
  // Binary encoding of the method's request message from rpc.proto; the
  // method string selects the schema through the committed rpc_methods.json
  // registry on both sides. Opaque to the kernel transport.
  bytes payload = 4;
  // Turn fence for turn-scoped methods, checked before payload decode.
  ActorTurnRef turn = 5;
  // Trusted subject for worker_agent-scoped methods.
  string agent_uid = 6;
}

message RPCResponse {
  string request_id = 1;
  // Binary encoding of the method's response message from rpc.proto.
  bytes payload = 2;
}

message RPCError {
  string request_id = 1;
  string code = 2;
  string message = 3;
  bytes details_json = 4;
}
