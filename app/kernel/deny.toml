# cargo-deny configuration for the kernel crate. Run from app/kernel:
#
#     cargo deny check
#
# The license allowlist is derived from the dependency tree by inspection. It
# is not yet confirmed by a cargo-deny run, so the check is not a CI step yet.
# When the first run reports a license that is missing here, add it on purpose
# instead of widening the list.

[graph]
# `nif` and `napi` are never built together, but every dependency of both must
# pass the license and advisory checks.
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
