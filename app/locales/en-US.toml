[app_configure.descriptions.agent_computer.background_agent_job]
max_running_per_agent = "Maximum concurrently running BackgroundAgentJobs per Agent."

[app_configure.descriptions.agent_computer.worker]
ready_timeout = "Seconds an observed Worker may stay not ready before its instance and cache are rebuilt."

[app_configure.descriptions.ai_agent]
inactivity_timeout_ms = "Agent Computer model/provider inactivity timeout in milliseconds. Running tools own their lifecycle; 0 disables the watchdog."
max_iterations = "Maximum logical model iterations for one Agent Computer turn execution."
max_output_tokens = "Optional Agent Computer max output tokens for one model response. nil means no explicit request cap."

[app_configure.descriptions.ai_agent.library]
agent_plugin_defaults = "Default enablement inherited by Agents for each Agent Plugin."
skill_defaults = "Default enablement inherited by Agents for standalone and Agent Plugin Skills."

[app_configure.descriptions.ai_gateway]
compaction = "AIGateway automatic history compaction settings. `threshold` is a ratio of the model input context; `max_threshold_tokens` caps that computed trigger."

[app_configure.descriptions.brain]
enabled = "Whether BrainV3 is enabled. Disabling stops memory tools, context injection, and all Brain background tasks; stored data stays unchanged."
maintainer_agent_uid = "Active Agent responsible for Brain maintenance. All Brain model calls run as this Agent and attribute usage to it. Its light profile extracts knowledge, its heavy profile runs Dreaming, and its web_fetch profile fetches URL Sources. Empty or disabled stops Brain model calls and local URL fetching until the Agent is enabled or replaced."
embedding_model = "Instance-global embedding model with provider_id, model, dimensions, and optional provider_options. Empty disables vector retrieval projections."
rerank_model = "Instance-global rerank model with provider_id, model, and optional provider_options. Empty skips rerank and keeps the fusion order."
search_tokenizer = "pg_search BM25 tokenizer: icu, jieba, lindera_japanese, or lindera_korean. Changing it requires a BM25 index rebuild."
chunking = "Chunker settings: chunk_size, chunk_overlap (CJK-aware words), max_chars, and max_tokens (o200k_base). All values enter the chunking signature."
forgetting = "Fact decay halflives in days per kind, plus purge_soft_delete_ttl_hours for hard-deleting soft-deleted Objects."
dreaming_task_cron = "Cron expression for the daily Dreaming maintenance task."
self_healing_task_cron = "Cron expression for the Self-healing task that rebuilds stale chunk, embedding, and index projections."
signal_channel_batch_idle_time = "Idle seconds after a signal channel's last message before its unprocessed slice enters batch learning. Conversation end also triggers it."
skill_learning_enabled = "Whether skill lessons are learned from job trajectories and delivered with skills. Disabling skips the Dreaming phase and hides stored lessons; data stays unchanged."
skill_learning_reflection_threshold = "Unconsumed signal jobs (mid-run human input or failed calls) an agent must accumulate before one skill-lesson reflection job starts. Minimum 2."

[app_configure.descriptions.i18n]
default_locale = "Default locale used when rendering Ankole text in this space."

[app_configure.descriptions.observability.traces]
enabled = "When true, the control plane exports process-wide OpenTelemetry traces to the configured OTLP endpoint after restart."
otlp_endpoint = "Base OTLP HTTP endpoint for traces. The exporter appends /v1/traces. Required when trace export is enabled."
otlp_headers = "Secret HTTP headers for OTLP trace export, such as Authorization. Values take effect after restart."
provider = "Semantic provider for LLM traces: langfuse, langsmith, or opentelemetry. Required when trace export is enabled."

[app_configure.descriptions.plugins]
