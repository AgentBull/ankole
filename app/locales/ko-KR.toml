[app_configure.descriptions.ai_agent.library]
agent_plugin_defaults = "각 Agent Plugin에 대해 Agent가 상속받는 기본 활성화 설정입니다."
skill_defaults = "독립형 Skill 및 Agent Plugin Skill에 대해 Agent가 상속받는 기본 활성화 설정입니다."

[app_configure.descriptions.ai_gateway]
