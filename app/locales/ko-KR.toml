[app_configure.descriptions.brain]
enabled = "BrainV3 사용 여부. 끄면 메모리 도구, 컨텍스트 주입, 모든 Brain 백그라운드 작업이 중지되며 저장된 데이터는 그대로 유지됩니다."
maintainer_agent_uid = "Brain 유지보수를 담당하는 활성 Agent입니다. 모든 Brain 모델 호출은 이 Agent의 ID로 실행되고 사용량도 이 Agent에 귀속됩니다. light 프로필은 지식 추출, heavy 프로필은 Dreaming, web_fetch 프로필은 URL 소스 가져오기에 사용합니다. 설정하지 않거나 이 Agent를 비활성화하면 다시 활성화하거나 교체할 때까지 Brain 모델 호출과 로컬 URL 가져오기가 중지됩니다."
embedding_model = "인스턴스 전역 임베딩 모델로 provider_id, model, dimensions와 선택적 provider_options를 가집니다. 비우면 벡터 검색 투영이 비활성화됩니다."
rerank_model = "인스턴스 전역 리랭크 모델로 provider_id, model과 선택적 provider_options를 가집니다. 비우면 리랭크를 건너뛰고 융합 순서를 유지합니다."
search_tokenizer = "pg_search BM25 토크나이저: icu, jieba, lindera_japanese, lindera_korean. 변경하면 BM25 인덱스 재구축이 필요합니다."
chunking = "청크 설정: chunk_size, chunk_overlap(CJK 인식 단어 수), max_chars, max_tokens(o200k_base). 모든 값이 청크 서명에 들어갑니다."
forgetting = "종류별 사실 감쇠 반감기(일)와 소프트 삭제된 객체를 영구 삭제하는 purge_soft_delete_ttl_hours."
dreaming_task_cron = "매일 실행되는 Dreaming 유지보수 작업의 cron 표현식."
self_healing_task_cron = "오래된 청크·임베딩·인덱스 투영을 재구축하는 자가 복구 작업의 cron 표현식."
signal_channel_batch_idle_time = "시그널 채널의 마지막 메시지 이후 미처리 슬라이스가 배치 학습에 들어가기까지의 유휴 초. 대화 종료 시에도 트리거됩니다."
skill_learning_enabled = "작업 궤적에서 스킬 교훈을 학습해 스킬과 함께 전달할지 여부. 비활성화하면 해당 Dreaming 단계를 건너뛰고 저장된 교훈을 숨깁니다. 데이터는 그대로 유지됩니다."
skill_learning_reflection_threshold = "스킬 교훈 리플렉션 작업을 시작하기 전에 Agent가 누적해야 하는 미소비 신호 작업 수(실행 중 사람 개입 또는 실패한 호출). 최소 2."

