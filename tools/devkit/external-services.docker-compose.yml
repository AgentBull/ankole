name: ankole-dev

services:
  postgres:
    image: ghcr.io/agentbull/ankole-postgres-for-ankole:main-latest
    command:
      [
        "postgres",
        "-c",
        "max_connections=${ANKOLE_POSTGRES_MAX_CONNECTIONS:-300}",
        "-c",
        "max_locks_per_transaction=256",
        "-c",
        "shared_preload_libraries=pg_search"
      ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: just4local-dev
      POSTGRES_DB: ankole_dev
      # Dev and test bootstrap creates four Base databases with this database's collation.
    ports:
      - "5433:5432"
    volumes:
      - postgres_for_ankole_data:/var/lib/pgsql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ankole_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  function-runtime:
    image: ankole-function-runtime:dev
    build:
      context: ../..
      dockerfile: app/function_runtime/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["start", "--main-service", "/opt/ankole/function_runtime/main", "--port", "9000"]
    environment:
      ANKOLE_FUNCTION_RUNTIME_TOKEN: ${ANKOLE_FUNCTION_RUNTIME_TOKEN:-dev-function-runtime-token}
    ports:
      - "5435:9000"
    healthcheck:
      test: ["CMD", "bash", "-ec", 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /_internal/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - functions


volumes:
  postgres_for_ankole_data:

networks:
  functions:
