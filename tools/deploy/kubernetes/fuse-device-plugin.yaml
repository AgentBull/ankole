# Install once per cluster. Workers request one smarter-devices/fuse unit.
# Upstream: https://gitlab.com/arm-research/smarter/smarter-device-manager/-/tree/v1.20.11
apiVersion: v1
kind: ConfigMap
metadata:
  name: ankole-fuse-devices
  namespace: kube-system
data:
  conf.yaml: |
    - devicematch: ^fuse$
      nummaxdevices: 128
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ankole-fuse-devices
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: ankole-fuse-devices
  template:
    metadata:
      labels:
        app: ankole-fuse-devices
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      automountServiceAccountToken: false
      containers:
        - name: device-manager
          image: registry.gitlab.com/arm-research/smarter/smarter-device-manager:v1.20.11
          terminationMessagePath: /termination-log
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: devices
              mountPath: /dev
              readOnly: true
            - name: plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: config
              mountPath: /root/config
              readOnly: true
      volumes:
        - name: devices
          hostPath:
            path: /dev
            type: Directory
        - name: plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: config
          configMap:
            name: ankole-fuse-devices
