apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ankole-agent.controlPlaneName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  strategy:
    {{- if or (eq .Values.files.store "fs") .Values.files.importAgentHomeClaim }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ankole-agent.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controlPlane.migration.enabled }}
      initContainers:
        - name: db-migrate
          image: {{ include "ankole-agent.image" (dict "image" .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          command:
            - /app/bin/migrate
          envFrom:
            - configMapRef:
                name: {{ include "ankole-agent.controlPlaneName" . }}
            - secretRef:
                name: {{ include "ankole-agent.bootstrapSecretName" . }}
          env:
            {{- include "ankole-agent.controlPlaneEnv" . | nindent 12 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "ankole-agent.image" (dict "image" .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          {{- with .Values.controlPlane.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.port }}
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: {{ .Values.controlPlane.distributionPort }}
              protocol: TCP
          # The Pod leaves the Service endpoints when it starts terminating.
          # The pause lets that update reach kube-proxy before SIGTERM closes
          # the Worker channels, so Workers reconnect to a remaining Pod.
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          envFrom:
            - configMapRef:
                name: {{ include "ankole-agent.controlPlaneName" . }}
            - secretRef:
                name: {{ include "ankole-agent.bootstrapSecretName" . }}
          env:
            {{- include "ankole-agent.controlPlaneEnv" . | nindent 12 }}
          volumeMounts:
            - name: bootstrap-secrets
              mountPath: /etc/ankole/bootstrap
              readOnly: true
            - name: worker-providers
              mountPath: /etc/ankole/worker
              readOnly: true
            {{- if .Values.files.importAgentHomeClaim }}
            - name: agents
              mountPath: /agents
              readOnly: true
            {{- end }}
            {{- if eq .Values.files.store "fs" }}
            - name: files
              mountPath: /var/lib/ankole/files
            {{- end }}
          startupProbe:
            httpGet:
              path: /_internal/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_internal/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /_internal/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          {{- with .Values.controlPlane.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml .Values.controlPlane.affinity | nindent 8 }}
      {{- else if gt (int .Values.controlPlane.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 20 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: bootstrap-secrets
          secret:
            secretName: {{ include "ankole-agent.bootstrapSecretName" . }}
        - name: worker-providers
          secret:
            secretName: {{ include "ankole-agent.workerProvidersName" . }}
        {{- with .Values.files.importAgentHomeClaim }}
        - name: agents
          persistentVolumeClaim:
            claimName: {{ . }}
            readOnly: true
        {{- end }}
        {{- if eq .Values.files.store "fs" }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "ankole-agent.filesClaimName" . }}
        {{- end }}
{{- if gt (int .Values.controlPlane.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ankole-agent.controlPlaneName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 6 }}
{{- end }}
