apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ankole-agent.controlPlaneName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  strategy:
    # Stop every old replica before the tenant migration changes the schema.
    # Restore rolling upgrades only after all supported upgrade origins contain
    # tenant ownership and mixed-version schema, writers and jobs are verified.
    type: Recreate
  selector:
    matchLabels:
      {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ankole-agent.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controlPlane.migration.enabled }}
      initContainers:
        - name: db-migrate
          image: {{ include "ankole-agent.image" (dict "image" .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          command:
            - /app/bin/migrate
          envFrom:
            - configMapRef:
                name: {{ include "ankole-agent.controlPlaneName" . }}
          env:
            {{- include "ankole-agent.controlPlaneEnv" . | nindent 12 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "ankole-agent.image" (dict "image" .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          {{- with .Values.controlPlane.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.port }}
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: {{ .Values.controlPlane.distributionPort }}
              protocol: TCP
          # The Pod leaves the Service endpoints when it starts terminating.
          # The pause lets that update reach kube-proxy before SIGTERM closes
          # the Worker channels, so Workers reconnect to a remaining Pod.
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          envFrom:
            - configMapRef:
                name: {{ include "ankole-agent.controlPlaneName" . }}
          env:
            {{- include "ankole-agent.controlPlaneEnv" . | nindent 12 }}
          volumeMounts:
            - name: bootstrap-secrets
              mountPath: /etc/ankole/bootstrap
              readOnly: true
            - name: worker-providers
              mountPath: /etc/ankole/worker
              readOnly: true
            {{- if .Values.files.importAgentHomeClaim }}
            - name: agents
              mountPath: /agents
              readOnly: true
            {{- end }}
            {{- if eq .Values.files.store "fs" }}
            - name: files
              mountPath: /var/lib/ankole/files
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          {{- with .Values.controlPlane.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: bootstrap-secrets
          secret:
            secretName: {{ include "ankole-agent.bootstrapSecretName" . }}
        - name: worker-providers
          secret:
            secretName: {{ include "ankole-agent.workerProvidersName" . }}
        {{- with .Values.files.importAgentHomeClaim }}
        - name: agents
          persistentVolumeClaim:
            claimName: {{ . }}
            readOnly: true
        {{- end }}
        {{- if eq .Values.files.store "fs" }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "ankole-agent.filesClaimName" . }}
        {{- end }}
