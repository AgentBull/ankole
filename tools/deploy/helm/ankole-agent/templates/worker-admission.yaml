{{- if .Values.worker.localPods }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ printf "%s-%s-worker" .Release.Namespace (include "ankole-agent.fullname" .) | trunc 253 | quote }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchConditions:
    - name: worker
      expression: >-
        object.spec.serviceAccountName == {{ include "ankole-agent.workerServiceAccountName" . | quote }}
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false)
      message: Worker Pods use their own network, PID and IPC namespaces.
    - expression: object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
      message: Worker Pods receive FUSE through the device plugin, without hostPath volumes.
    - expression: >-
        variables.containers.all(c,
          !c.?securityContext.?privileged.orValue(false) &&
          c.?securityContext.?allowPrivilegeEscalation == optional.of(false) &&
          c.?securityContext.?runAsUser == optional.of(0) &&
          c.?securityContext.?runAsGroup == optional.of(0) &&
          c.?securityContext.?seccompProfile.?type == optional.of('RuntimeDefault') &&
          c.?securityContext.?appArmorProfile.?type == optional.of('Unconfined') &&
          c.?securityContext.?capabilities.?drop.orValue([]) == ['ALL'] &&
          c.?securityContext.?capabilities.?add.orValue([]).all(cap,
            cap in ['SETUID','SETGID','SETPCAP','CHOWN','FOWNER','DAC_OVERRIDE','KILL','SYS_ADMIN']))
      message: Worker supervisors use the declared FUSE capability profile and drop capabilities before running Agent processes.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-%s-worker" .Release.Namespace (include "ankole-agent.fullname" .) | trunc 253 | quote }}
spec:
  policyName: {{ printf "%s-%s-worker" .Release.Namespace (include "ankole-agent.fullname" .) | trunc 253 | quote }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
{{- end }}
