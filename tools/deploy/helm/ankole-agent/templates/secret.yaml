{{- if not .Values.secrets.existingSecret }}
{{- $postgresqlPassword := include "ankole-agent.postgresqlPassword" . }}
{{- $databaseURL := .Values.secrets.databaseURL }}
{{- if and (not $databaseURL) .Values.postgresql.enabled }}
{{- $databaseURL = printf "ecto://%s:%s@%s:%v/%s" .Values.postgresql.auth.username ($postgresqlPassword | urlquery) (include "ankole-agent.postgresqlName" .) .Values.postgresql.port .Values.postgresql.auth.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ankole-agent.bootstrapSecretName" . }}
  labels:
    {{- include "ankole-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANKOLE_SECRET_BASE: {{ include "ankole-agent.ankoleSecretBase" . | quote }}
  ANKOLE_FUNCTION_RUNTIME_TOKEN: {{ include "ankole-agent.functionRuntimeToken" . | quote }}
  RELEASE_COOKIE: {{ include "ankole-agent.releaseCookie" . | quote }}
  DATABASE_URL: {{ required "secrets.databaseURL is required when postgresql.enabled is false" $databaseURL | quote }}
  {{- with .Values.secrets.baseDBURLs }}
  BASE_DB_URLS: {{ . | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $postgresqlPassword | quote }}
  {{- end }}
  {{- with .Values.secrets.filesS3AccessKeyID }}
  ANKOLE_FILES_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.filesS3SecretAccessKey }}
  ANKOLE_FILES_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
