apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ankole-agent.controlPlaneName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
data:
  ANKOLE_AI_GATEWAY_BASE_URL: {{ printf "http://%s:%v/api/v1/ai-gateway" (include "ankole-agent.controlPlaneName" .) .Values.controlPlane.service.port | quote }}
  PHX_HOST: {{ .Values.controlPlane.publicHost | quote }}
  ANKOLE_SITE_ADMIN_CONSOLE_PATH: {{ .Values.controlPlane.siteAdminConsolePath | quote }}
  PORT: {{ .Values.controlPlane.port | quote }}
  DNS_CLUSTER_QUERY: {{ printf "%s.%s.svc.%s" (include "ankole-agent.controlPlaneHeadlessName" .) .Release.Namespace .Values.controlPlane.clusterDomain | quote }}
  ANKOLE_DIST_PORT: {{ .Values.controlPlane.distributionPort | quote }}
  {{- if .Values.worker.image.repository }}
  ANKOLE_AGENT_COMPUTER_IMAGE: {{ include "ankole-agent.image" (dict "image" .Values.worker.image) | quote }}
  {{- end }}
  ANKOLE_WORKER_RUNTIME_FABRIC_ENDPOINT: {{ include "ankole-agent.workerRuntimeFabricEndpoint" . | quote }}
  ANKOLE_WORKER_INSTALLATION: {{ include "ankole-agent.workerInstallation" . | quote }}
  ANKOLE_WORKER_PROVIDERS_FILE: /etc/ankole/worker/providers.yaml
  ANKOLE_FILES_STORE: {{ .Values.files.store | quote }}
  {{- if eq .Values.files.store "fs" }}
  ANKOLE_FILES_FS_ROOT: /var/lib/ankole/files
  {{- else }}
  ANKOLE_FILES_S3_BUCKET: {{ .Values.files.s3.bucket | quote }}
  ANKOLE_FILES_S3_REGION: {{ .Values.files.s3.region | quote }}
  {{- with .Values.files.s3.endpoint }}
  ANKOLE_FILES_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.files.s3.root }}
  ANKOLE_FILES_S3_ROOT: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.controlPlane.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
