apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ankole-agent.functionRuntimeName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "function-runtime") | nindent 4 }}
spec:
  {{- if not .Values.functionRuntime.autoscaling.enabled }}
  replicas: {{ .Values.functionRuntime.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "function-runtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "function-runtime") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: function-runtime
          image: {{ include "ankole-agent.image" (dict "image" .Values.functionRuntime.image) | quote }}
          imagePullPolicy: {{ .Values.functionRuntime.image.pullPolicy }}
          ports:
            - name: functions
              containerPort: 9000
          env:
            - name: ANKOLE_FUNCTION_RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ankole-agent.bootstrapSecretName" . }}
                  key: ANKOLE_FUNCTION_RUNTIME_TOKEN
            - name: ANKOLE_FUNCTION_RUNTIME_MAX_CONCURRENCY
              value: {{ .Values.functionRuntime.maxConcurrency | quote }}
          readinessProbe:
            httpGet:
              path: /_internal/health
              port: functions
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: functions
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["bash", "-ec", "kill -TERM 1; sleep 5"]
          resources:
            {{- toYaml .Values.functionRuntime.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ankole-agent.functionRuntimeName" . }}-headless
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "function-runtime") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  ports:
    - name: functions
      port: 9000
      targetPort: functions
  selector:
    {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "function-runtime") | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ankole-agent.functionRuntimeName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "function-runtime") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "function-runtime") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ankole-agent.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 14 }}
      ports:
        - port: 9000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.functionRuntime.deniedCIDRs | nindent 14 }}
{{- if .Values.functionRuntime.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ankole-agent.functionRuntimeName" . }}
  labels:
    {{- include "ankole-agent.componentLabels" (dict "root" . "component" "function-runtime") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ankole-agent.functionRuntimeName" . }}
  minReplicas: {{ .Values.functionRuntime.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.functionRuntime.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.functionRuntime.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
