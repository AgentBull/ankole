name: ankole

x-control-plane-environment: &control-plane-environment
  ANKOLE_SECRET_BASE: ${ANKOLE_SECRET_BASE:?Set ANKOLE_SECRET_BASE in .env}
  # Distributed Erlang cookie. Every pull of a published control-plane image
  # holds the same built-in cookie, so each deployment sets its own.
  RELEASE_COOKIE: ${RELEASE_COOKIE:?Set RELEASE_COOKIE in .env}
  DATABASE_URL: ecto://ankole:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgresql:5432/ankole
  PHX_SERVER: "true"
  PHX_HOST: ${ANKOLE_HOST:?Set ANKOLE_HOST in .env}
  ANKOLE_SITE_ADMIN_CONSOLE_PATH: ${ANKOLE_SITE_ADMIN_CONSOLE_PATH:-/site-admin-console}
  PORT: "4000"
  POOL_SIZE: ${ANKOLE_DATABASE_POOL_SIZE:-10}
  ANKOLE_LOG_LEVEL: ${ANKOLE_LOG_LEVEL:-info}
  ANKOLE_LIBRARY_ROOT: /app/app/library
  ANKOLE_AI_GATEWAY_BASE_URL: http://control-plane:4000/api/v1/ai-gateway
  ANKOLE_RUNTIME_FABRIC_INTERNAL_ORIGIN: http://control-plane:4000
  # Agent drives and attachments. The directory is the files_data volume.
  ANKOLE_FILES_STORE: fs
  ANKOLE_FILES_FS_ROOT: /var/lib/ankole/files
  # The control plane creates one Worker container per Agent through the
  # Docker socket. The image is the Worker of the same release, built into
  # the control-plane image. Worker containers join the workers network: they
  # reach the control plane and the internet, but not PostgreSQL, which is
  # only on the internal backend network.
  ANKOLE_WORKER_PROVIDERS_FILE: /etc/ankole/worker-providers.yaml
  ANKOLE_WORKER_INSTALLATION: ${ANKOLE_WORKER_INSTALLATION:-ankole}
  ANKOLE_WORKER_RUNTIME_FABRIC_ENDPOINT: ws://control-plane:4000/runtime-fabric/worker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  postgresql:
    image: ${ANKOLE_POSTGRESQL_IMAGE:-ghcr.io/agentbull/ankole-postgres-for-ankole@sha256:002f1569c7d90cc31b74e5eca3225a138d5e3b8a748f32eaa78752304502de71}
    pull_policy: always
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search
      - -c
      - max_connections=${ANKOLE_POSTGRES_MAX_CONNECTIONS:-300}
    environment:
      LANG: C.utf8
      POSTGRES_USER: ankole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ankole
    volumes:
      - postgresql_data:/var/lib/pgsql/18/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ankole -d ankole
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging: *default-logging
    networks:
      - backend

  migrate:
    image: ${ANKOLE_CONTROL_PLANE_IMAGE:-ghcr.io/agentbull/ankole-agent-control-plane:2.0.0-alpha.5}
    pull_policy: always
    restart: "no"
    command:
      - /app/bin/migrate
    environment: *control-plane-environment
    depends_on:
      postgresql:
        condition: service_healthy
    logging: *default-logging
    networks:
      - backend

  migrate-agent-homes:
    image: docker:29-cli
    restart: "no"
    entrypoint: [sh, /migrate-agent-homes.sh]
    environment:
      LEGACY_VOLUME: ${COMPOSE_PROJECT_NAME:-ankole}_agents_data
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ankole}
      WORKER_INSTALLATION: ${ANKOLE_WORKER_INSTALLATION:-ankole}
      WORKER_PROVIDER: docker
      MIGRATION_IMAGE: docker:29-cli
    volumes:
      - ${ANKOLE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./migrate-agent-homes.sh:/migrate-agent-homes.sh:ro
    network_mode: none
    # The migration reads the existing Agents from PostgreSQL.
    depends_on:
      postgresql:
        condition: service_healthy
    logging: *default-logging

  control-plane:
    image: ${ANKOLE_CONTROL_PLANE_IMAGE:-ghcr.io/agentbull/ankole-agent-control-plane:2.0.0-alpha.5}
    pull_policy: always
    restart: unless-stopped
    environment: *control-plane-environment
    # The control plane runs as user ankole; this group gives it the Docker
    # socket, which is equal to root on the host.
    group_add:
      - ${ANKOLE_DOCKER_GID:?Set ANKOLE_DOCKER_GID in .env to the group of the Docker socket}
    volumes:
      - files_data:/var/lib/ankole/files
      - ${ANKOLE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./worker-providers.yaml:/etc/ankole/worker-providers.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-agent-homes:
        condition: service_completed_successfully
    expose:
      - "4000"
    logging: *default-logging
    networks:
      - backend
      - frontend
      - workers

  caddy:
    image: caddy:2-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      ANKOLE_HOST: ${ANKOLE_HOST:?Set ANKOLE_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      control-plane:
        condition: service_started
    logging: *default-logging
    networks:
      - frontend

volumes:
  postgresql_data:
  files_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:
  workers:
