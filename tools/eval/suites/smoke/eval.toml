[harness]
agent = "oracle"
environment = "docker"
required_env = []

[[guardrails]]
name = "the deterministic artifact is verified"
reward = "artifact_verified"
cohort = "all"
minimum_mean = 1.0

[variants.baseline]
description = "No-model framework control"
change_owner = "control"

[variants.candidate]
description = "No-model framework repeat"
change_owner = "tools/eval"
