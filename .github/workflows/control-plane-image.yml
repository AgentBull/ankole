name: Publish control plane image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force control-plane image rebuild"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: control-plane-image-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTROL_PLANE_IMAGE: ghcr.io/agentbull/ankole-agent-control-plane
  IMAGE_TAG: main-latest

jobs:
  detect_control_plane:
    name: Detect control-plane image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect control-plane image changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          image="${CONTROL_PLANE_IMAGE}"
          target_sha="${GITHUB_SHA}"
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' }}"

          if [ "${force_rebuild}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced control-plane rebuild requested"
            exit 0
          fi

          published_metadata="$(docker buildx imagetools inspect "${image}:${IMAGE_TAG}" --format '{{json .}}' 2>/dev/null || true)"
          if [ -z "${published_metadata}" ]; then
            published_metadata="{}"
          fi

          published_revision="$(
            jq -r '(.image["linux/amd64"].config.Labels // {})["org.opencontainers.image.revision"] // empty' \
              <<<"${published_metadata}"
          )"

          if [ -z "${published_revision}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No published revision label found on ${image}:${IMAGE_TAG}; rebuilding"
            exit 0
          fi

          if ! git cat-file -e "${published_revision}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published revision ${published_revision} is not present in this checkout; rebuilding"
            exit 0
          fi

          changed_files="$(git diff --name-only "${published_revision}" "${target_sha}")"
          control_plane_pattern='^(\.dockerignore$|package\.json$|bun\.lock$|tsconfig\.json$|tsconfig\.base\.json$|app/agent_computer/package\.json$|app/control_plane/|app/kernel/|app/library/|app/locales/|app/webapps/|libs/|plugins/|tools/devkit/package\.json$|\.github/workflows/control-plane-image\.yml$)'

          if grep -Eq "${control_plane_pattern}" <<<"${changed_files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Control-plane image changes since published revision ${published_revision}:"
            grep -E "${control_plane_pattern}" <<<"${changed_files}" || true
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No control-plane image changes since published revision ${published_revision}"
          fi

      - name: Skip control-plane image
        if: ${{ steps.changes.outputs.changed != 'true' }}
        run: echo "No control-plane image changes detected."

  build_control_plane:
    name: Build and push control-plane image (${{ matrix.arch }})
    needs: detect_control_plane
    if: ${{ needs.detect_control_plane.outputs.changed == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Ankole version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          changelog_version="$(awk '$1 == "##" && $2 == "Version" { print $3; exit }' CHANGELOG.md)"
          if [[ ! "${changelog_version}" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Could not read the latest Ankole version from CHANGELOG.md" >&2
            exit 1
          fi

          echo "value=v${changelog_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/control_plane/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.CONTROL_PLANE_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          build-args: |
            ANKOLE_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=registry,ref=${{ env.CONTROL_PLANE_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CONTROL_PLANE_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_control_plane_manifest:
    name: Publish control-plane manifest
    needs:
      - detect_control_plane
      - build_control_plane
    if: ${{ needs.detect_control_plane.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}" \
            "${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}-amd64" \
            "${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}-arm64"

          docker buildx imagetools inspect "${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}"
