name: Publish control plane image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force control-plane image rebuild"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: control-plane-image-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTROL_PLANE_IMAGE: ghcr.io/agentbull/ankole-agent-control-plane
  IMAGE_TAG: main-latest

jobs:
  control-plane:
    name: Build and push control-plane image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect control-plane image changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          image="${CONTROL_PLANE_IMAGE}"
          target_sha="${GITHUB_SHA}"
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' }}"

          if [ "${force_rebuild}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced control-plane rebuild requested"
            exit 0
          fi

          published_metadata="$(docker buildx imagetools inspect "${image}:${IMAGE_TAG}" --format '{{json .}}' 2>/dev/null || true)"
          if [ -z "${published_metadata}" ]; then
            published_metadata="{}"
          fi

          published_revision="$(
            jq -r '(.image["linux/amd64"].config.Labels // {})["org.opencontainers.image.revision"] // empty' \
              <<<"${published_metadata}"
          )"

          if [ -z "${published_revision}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No published revision label found on ${image}:${IMAGE_TAG}; rebuilding"
            exit 0
          fi

          if ! git cat-file -e "${published_revision}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published revision ${published_revision} is not present in this checkout; rebuilding"
            exit 0
          fi

          changed_files="$(git diff --name-only "${published_revision}" "${target_sha}")"
          control_plane_pattern='^(\.dockerignore$|package\.json$|bun\.lock$|app/control_plane/|app/webapps/|libs/uikit/|libs/feishu_openapi/|app/kernel/|plugins/|\.github/workflows/control-plane-image\.yml$)'

          if grep -Eq "${control_plane_pattern}" <<<"${changed_files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Control-plane image changes since published revision ${published_revision}:"
            grep -E "${control_plane_pattern}" <<<"${changed_files}" || true
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No control-plane image changes since published revision ${published_revision}"
          fi

      - name: Skip control-plane image
        if: ${{ steps.changes.outputs.changed != 'true' }}
        run: echo "No control-plane image changes detected."

      - name: Set up QEMU
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Build and push control-plane image
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/control_plane/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.CONTROL_PLANE_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CONTROL_PLANE_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.CONTROL_PLANE_IMAGE }}:buildcache,mode=max
          provenance: false
