name: Publish agent computer images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_base_rebuild:
        description: "Force OS base image rebuild"
        required: false
        type: boolean
        default: false
      force_worker_rebuild:
        description: "Force worker image rebuild"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-computer-images-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/agentbull/ankole-agent-os-base
  WORKER_IMAGE: ghcr.io/agentbull/ankole-agent-computer-worker
  IMAGE_TAG: main-latest

jobs:
  detect_base_image:
    name: Detect OS base image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect OS base image changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          image="${BASE_IMAGE}"
          target_sha="${GITHUB_SHA}"
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_base_rebuild == 'true' }}"

          if [ "${force_rebuild}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced OS base rebuild requested"
            exit 0
          fi

          published_metadata="$(docker buildx imagetools inspect "${image}:${IMAGE_TAG}" --format '{{json .}}' 2>/dev/null || true)"
          if [ -z "${published_metadata}" ]; then
            published_metadata="{}"
          fi

          published_revision="$(
            jq -r '(.image["linux/amd64"].config.Labels // {})["org.opencontainers.image.revision"] // empty' \
              <<<"${published_metadata}"
          )"

          if [ -z "${published_revision}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No published revision label found on ${image}:${IMAGE_TAG}; rebuilding"
            exit 0
          fi

          if ! git cat-file -e "${published_revision}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published revision ${published_revision} is not present in this checkout; rebuilding"
            exit 0
          fi

          changed_files="$(git diff --name-only "${published_revision}" "${target_sha}")"

          if grep -Eq '^(\.dockerignore$|app/agent_computer/Dockerfile\.base$|\.github/workflows/agent-computer-images\.yml$)' <<<"${changed_files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "OS base image changes since published revision ${published_revision}:"
            grep -E '^(\.dockerignore$|app/agent_computer/Dockerfile\.base$|\.github/workflows/agent-computer-images\.yml$)' <<<"${changed_files}" || true
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No OS base image changes since published revision ${published_revision}"
          fi

      - name: Skip OS base image
        if: ${{ steps.changes.outputs.changed != 'true' }}
        run: echo "No OS base image changes detected."

  build_base_image:
    name: Build and push OS base image (${{ matrix.arch }})
    needs: detect_base_image
    if: ${{ needs.detect_base_image.outputs.changed == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OS base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/agent_computer/Dockerfile.base
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.BASE_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_base_manifest:
    name: Publish OS base image manifest
    needs:
      - detect_base_image
      - build_base_image
    if: ${{ needs.detect_base_image.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform OS base manifest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${BASE_IMAGE}:${IMAGE_TAG}" \
            "${BASE_IMAGE}:${IMAGE_TAG}-amd64" \
            "${BASE_IMAGE}:${IMAGE_TAG}-arm64"

          docker buildx imagetools inspect "${BASE_IMAGE}:${IMAGE_TAG}"

  detect_worker_image:
    name: Detect worker image changes
    needs:
      - detect_base_image
      - publish_base_manifest
    if: ${{ always() && ((needs.detect_base_image.result == 'success' && needs.detect_base_image.outputs.changed != 'true') || needs.publish_base_manifest.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      base_digest: ${{ steps.changes.outputs.base_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect worker image changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base_image="${BASE_IMAGE}"
          worker_image="${WORKER_IMAGE}"
          target_sha="${GITHUB_SHA}"
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_worker_rebuild == 'true' }}"

          base_metadata="$(docker buildx imagetools inspect "${base_image}:${IMAGE_TAG}" --format '{{json .}}' 2>/dev/null || true)"
          if [ -z "${base_metadata}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "base_digest=" >> "$GITHUB_OUTPUT"
            echo "OS base image ${base_image}:${IMAGE_TAG} is missing; worker image must rebuild after base is available"
            exit 0
          fi

          base_digest="$(jq -r '.manifest.digest // empty' <<<"${base_metadata}")"
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"

          if [ "${force_rebuild}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced worker rebuild requested"
            exit 0
          fi

          published_metadata="$(docker buildx imagetools inspect "${worker_image}:${IMAGE_TAG}" --format '{{json .}}' 2>/dev/null || true)"
          if [ -z "${published_metadata}" ]; then
            published_metadata="{}"
          fi

          published_revision="$(
            jq -r '(.image["linux/amd64"].config.Labels // {})["org.opencontainers.image.revision"] // empty' \
              <<<"${published_metadata}"
          )"
          published_base_digest="$(
            jq -r '(.image["linux/amd64"].config.Labels // {})["ankole.base.digest"] // empty' \
              <<<"${published_metadata}"
          )"

          if [ -z "${published_revision}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No published revision label found on ${worker_image}:${IMAGE_TAG}; rebuilding"
            exit 0
          fi

          if [ -n "${base_digest}" ] && [ "${published_base_digest}" != "${base_digest}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Worker image base digest changed from ${published_base_digest:-<none>} to ${base_digest}; rebuilding"
            exit 0
          fi

          if ! git cat-file -e "${published_revision}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published revision ${published_revision} is not present in this checkout; rebuilding"
            exit 0
          fi

          changed_files="$(git diff --name-only "${published_revision}" "${target_sha}")"
          worker_pattern='^(\.dockerignore$|package\.json$|bun\.lock$|app/agent_computer/Dockerfile$|app/agent_computer/package\.json$|app/agent_computer/bin/|app/agent_computer/src/|app/kernel/|app/library/|\.github/workflows/agent-computer-images\.yml$)'

          if grep -Eq "${worker_pattern}" <<<"${changed_files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Worker image changes since published revision ${published_revision}:"
            grep -E "${worker_pattern}" <<<"${changed_files}" || true
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No worker image changes since published revision ${published_revision}"
          fi

      - name: Skip worker image
        if: ${{ steps.changes.outputs.changed != 'true' }}
        run: echo "No worker image changes detected."

  build_worker_image:
    name: Build and push agent computer worker image (${{ matrix.arch }})
    needs: detect_worker_image
    if: ${{ needs.detect_worker_image.outputs.changed == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/agent_computer/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ env.IMAGE_TAG }}
          tags: ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ankole.base.digest=${{ needs.detect_worker_image.outputs.base_digest }}
          cache-from: type=registry,ref=${{ env.WORKER_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.WORKER_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_worker_manifest:
    name: Publish worker image manifest
    needs:
      - detect_worker_image
      - build_worker_image
    if: ${{ needs.detect_worker_image.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform worker manifest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${WORKER_IMAGE}:${IMAGE_TAG}" \
            "${WORKER_IMAGE}:${IMAGE_TAG}-amd64" \
            "${WORKER_IMAGE}:${IMAGE_TAG}-arm64"

          docker buildx imagetools inspect "${WORKER_IMAGE}:${IMAGE_TAG}"
