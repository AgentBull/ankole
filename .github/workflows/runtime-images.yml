name: Publish RuntimeFabric image pair

on:
  # A push to main releases only after the "Repository checks" workflow of that
  # revision succeeds. The `release_gate` job admits the checked revision; it
  # skips a revision whose only changes since the last release are
  # documentation, the website, or the changelog, because such a commit adds no
  # changelog version and none of those paths is copied by
  # app/control_plane/Dockerfile or app/agent_computer/Dockerfile.
  workflow_run:
    workflows: ["Repository checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/agentbull/ankole-agent-os-base
  CONTROL_PLANE_IMAGE: ghcr.io/agentbull/ankole-agent-control-plane
  WORKER_IMAGE: ghcr.io/agentbull/ankole-agent-computer-worker
  FUNCTION_RUNTIME_IMAGE: ghcr.io/agentbull/ankole-function-runtime
  LATEST_TAG: main-latest
  # A `workflow_run` event runs on the default branch; the checked revision is
  # `head_sha`, not `github.sha`.
  RELEASE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
  STAGING_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  release_gate:
    name: Admit the checked revision
    runs-on: ubuntu-latest
    # Every completed "Repository checks" run on main arrives here; only a green
    # run of a push passes. A manual dispatch passes as before.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    outputs:
      admitted: ${{ steps.decide.outputs.admitted }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Decide whether the revision has a release to publish
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_run" ]]; then
            echo "admitted=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          release_version="$(
            bun tools/devkit/src/changelog-release.ts \
              extract CHANGELOG.md "${RUNNER_TEMP}/release-notes.md"
          )"
          release_tag="v${release_version}"

          if ! git fetch --quiet --depth=1 origin "refs/tags/${release_tag}:refs/tags/${release_tag}"; then
            echo "Version ${release_version} has no Git tag yet"
            echo "admitted=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag_sha="$(git rev-parse "${release_tag}^{commit}")"
          if [[ "${tag_sha}" == "${RELEASE_REVISION}" ]]; then
            echo "Version ${release_version} is tagged at this revision"
            echo "admitted=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The newest changelog version was released from another commit. That
          # is correct only when nothing that reaches the images changed since.
          runtime_changes="$(
            git diff --name-only "${tag_sha}" "${RELEASE_REVISION}" \
              | grep -Ev '^([^/]+\.md|app/website/.*|docs/.*|\.github/workflows/website-pages\.yml)$' || true
          )"
          if [[ -n "${runtime_changes}" ]]; then
            echo "CHANGELOG.md still names ${release_version}, released from ${tag_sha}, but these files changed since:" >&2
            echo "${runtime_changes}" >&2
            exit 1
          fi

          echo "Only documentation changed since ${release_tag}; there is nothing to release"
          echo "admitted=false" >> "${GITHUB_OUTPUT}"

  inspect_existing:
    name: Inspect immutable release tags
    needs: release_gate
    if: ${{ needs.release_gate.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      base_exists: ${{ steps.inspect.outputs.base_exists }}
      control_plane_exists: ${{ steps.inspect.outputs.control_plane_exists }}
      worker_exists: ${{ steps.inspect.outputs.worker_exists }}
      function_runtime_exists: ${{ steps.inspect.outputs.function_runtime_exists }}
      protocol_version: ${{ steps.protocol.outputs.value }}
      release_version: ${{ steps.version.outputs.value }}
      release_is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_uses_canary: ${{ steps.version.outputs.uses_canary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Read Ankole release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(
            bun tools/devkit/src/changelog-release.ts \
              extract CHANGELOG.md "${RUNNER_TEMP}/release-notes.md"
          )"
          echo "value=${release_version}" >> "${GITHUB_OUTPUT}"

          read -r is_prerelease uses_canary < <(
            bun tools/devkit/src/changelog-release.ts classify "${release_version}"
          )
          echo "is_prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"
          echo "uses_canary=${uses_canary}" >> "${GITHUB_OUTPUT}"

      - name: Read RuntimeFabric protocol version
        id: protocol
        shell: bash
        run: |
          set -euo pipefail

          protocol_version="$(sed -nE 's/^  PROTOCOL_VERSION_CURRENT = ([0-9]+);$/\1/p' app/kernel/proto/ankole/runtime_fabric/v1/envelope.proto)"
          if [[ ! "${protocol_version}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Could not read RuntimeFabric protocol version" >&2
            exit 1
          fi

          echo "value=${protocol_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect release tags without overwriting them
        id: inspect
        shell: bash
        run: |
          set -euo pipefail

          inspect_ref() {
            local output_name="$1"
            local image="$2"
            local ref="${image}:${RELEASE_REVISION}"

            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              echo "${output_name}=true" >> "${GITHUB_OUTPUT}"
              echo "Reusing existing immutable image ${ref}"
            else
              echo "${output_name}=false" >> "${GITHUB_OUTPUT}"
              echo "Image ${ref} is not published yet"
            fi
          }

          inspect_ref base_exists "${BASE_IMAGE}"
          inspect_ref control_plane_exists "${CONTROL_PLANE_IMAGE}"
          inspect_ref worker_exists "${WORKER_IMAGE}"
          inspect_ref function_runtime_exists "${FUNCTION_RUNTIME_IMAGE}"

  build_base:
    name: Build OS base image (${{ matrix.arch }})
    needs: inspect_existing
    if: ${{ needs.inspect_existing.outputs.base_exists != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staged OS base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/agent_computer/Dockerfile.base
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.BASE_IMAGE }}:${{ env.STAGING_TAG }}-base-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_base:
    name: Publish immutable OS base image
    needs:
      - inspect_existing
      - build_base
    if: ${{ always() && needs.inspect_existing.result == 'success' && (needs.inspect_existing.outputs.base_exists == 'true' || needs.build_base.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-platform OS base manifest
        if: ${{ needs.inspect_existing.outputs.base_exists != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${BASE_IMAGE}:${RELEASE_REVISION}" \
            "${BASE_IMAGE}:${STAGING_TAG}-base-amd64" \
            "${BASE_IMAGE}:${STAGING_TAG}-base-arm64"

      - name: Resolve OS base digest
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(docker buildx imagetools inspect "${BASE_IMAGE}:${RELEASE_REVISION}" --format '{{json .}}')"
          digest="$(jq -r '.manifest.digest // empty' <<<"${metadata}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Immutable OS base image has no multi-platform digest" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  build_control_plane:
    name: Build control-plane image (${{ matrix.arch }})
    needs: inspect_existing
    if: ${{ needs.inspect_existing.outputs.control_plane_exists != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staged control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/control_plane/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            ANKOLE_VERSION=v${{ needs.inspect_existing.outputs.release_version }}
            ANKOLE_RELEASE_REVISION=${{ env.RELEASE_REVISION }}
            ANKOLE_AGENT_COMPUTER_IMAGE=${{ env.WORKER_IMAGE }}:${{ env.RELEASE_REVISION }}
          tags: ${{ env.CONTROL_PLANE_IMAGE }}:${{ env.STAGING_TAG }}-control-plane-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
            org.opencontainers.image.version=v${{ needs.inspect_existing.outputs.release_version }}
            io.ankole.runtime-fabric.protocol-version=${{ needs.inspect_existing.outputs.protocol_version }}
          cache-from: type=registry,ref=${{ env.CONTROL_PLANE_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CONTROL_PLANE_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_control_plane:
    name: Publish immutable control-plane image
    needs:
      - inspect_existing
      - build_control_plane
    if: ${{ always() && needs.inspect_existing.result == 'success' && (needs.inspect_existing.outputs.control_plane_exists == 'true' || needs.build_control_plane.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-platform control-plane manifest
        if: ${{ needs.inspect_existing.outputs.control_plane_exists != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${CONTROL_PLANE_IMAGE}:${RELEASE_REVISION}" \
            "${CONTROL_PLANE_IMAGE}:${STAGING_TAG}-control-plane-amd64" \
            "${CONTROL_PLANE_IMAGE}:${STAGING_TAG}-control-plane-arm64"

      - name: Inspect immutable control-plane image
        run: docker buildx imagetools inspect "${CONTROL_PLANE_IMAGE}:${RELEASE_REVISION}"

  build_function_runtime:
    name: Build function-runtime image (${{ matrix.arch }})
    needs: inspect_existing
    if: ${{ needs.inspect_existing.outputs.function_runtime_exists != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staged function-runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/function_runtime/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            RELEASE_REVISION=${{ env.RELEASE_REVISION }}
            RUNTIME_FABRIC_PROTOCOL_VERSION=${{ needs.inspect_existing.outputs.protocol_version }}
          tags: ${{ env.FUNCTION_RUNTIME_IMAGE }}:${{ env.STAGING_TAG }}-function-runtime-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
            org.opencontainers.image.version=v${{ needs.inspect_existing.outputs.release_version }}
            io.ankole.runtime-fabric.protocol-version=${{ needs.inspect_existing.outputs.protocol_version }}
          cache-from: type=registry,ref=${{ env.FUNCTION_RUNTIME_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.FUNCTION_RUNTIME_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_function_runtime:
    name: Publish immutable function-runtime image
    needs:
      - inspect_existing
      - build_function_runtime
    if: ${{ always() && needs.inspect_existing.result == 'success' && (needs.inspect_existing.outputs.function_runtime_exists == 'true' || needs.build_function_runtime.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-platform function-runtime manifest
        if: ${{ needs.inspect_existing.outputs.function_runtime_exists != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${FUNCTION_RUNTIME_IMAGE}:${RELEASE_REVISION}" \
            "${FUNCTION_RUNTIME_IMAGE}:${STAGING_TAG}-function-runtime-amd64" \
            "${FUNCTION_RUNTIME_IMAGE}:${STAGING_TAG}-function-runtime-arm64"

      - name: Inspect immutable function-runtime image
        run: docker buildx imagetools inspect "${FUNCTION_RUNTIME_IMAGE}:${RELEASE_REVISION}"

  build_worker:
    name: Build Agent Computer worker image (${{ matrix.arch }})
    needs:
      - inspect_existing
      - publish_base
    # A reused OS base skips its build job. Check the direct publication result.
    if: ${{ !cancelled() && needs.inspect_existing.result == 'success' && needs.publish_base.result == 'success' && needs.inspect_existing.outputs.worker_exists != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staged worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/agent_computer/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}@${{ needs.publish_base.outputs.digest }}
            ANKOLE_RELEASE_REVISION=${{ env.RELEASE_REVISION }}
          tags: ${{ env.WORKER_IMAGE }}:${{ env.STAGING_TAG }}-worker-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
            io.ankole.runtime-fabric.protocol-version=${{ needs.inspect_existing.outputs.protocol_version }}
            io.ankole.agent-os-base.digest=${{ needs.publish_base.outputs.digest }}
          cache-from: type=registry,ref=${{ env.WORKER_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.WORKER_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

  publish_worker:
    name: Publish immutable Agent Computer worker image
    needs:
      - inspect_existing
      - build_worker
    if: ${{ always() && needs.inspect_existing.result == 'success' && (needs.inspect_existing.outputs.worker_exists == 'true' || needs.build_worker.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable multi-platform worker manifest
        if: ${{ needs.inspect_existing.outputs.worker_exists != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${WORKER_IMAGE}:${RELEASE_REVISION}" \
            "${WORKER_IMAGE}:${STAGING_TAG}-worker-amd64" \
            "${WORKER_IMAGE}:${STAGING_TAG}-worker-arm64"

      - name: Inspect immutable worker image
        run: docker buildx imagetools inspect "${WORKER_IMAGE}:${RELEASE_REVISION}"

  verify_pair:
    name: Publish verified runtime images
    needs:
      - inspect_existing
      - publish_control_plane
      - publish_worker
      - publish_function_runtime
    # Reused images skip build jobs. Check direct publication results so those
    # skipped ancestors do not suppress pair verification.
    if: ${{ !cancelled() && needs.inspect_existing.result == 'success' && needs.publish_control_plane.result == 'success' && needs.publish_worker.result == 'success' && needs.publish_function_runtime.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect all immutable images
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools inspect \
            "${CONTROL_PLANE_IMAGE}:${RELEASE_REVISION}" \
            --format '{{json .}}' > "${RUNNER_TEMP}/control-plane-image.json"
          docker buildx imagetools inspect \
            "${WORKER_IMAGE}:${RELEASE_REVISION}" \
            --format '{{json .}}' > "${RUNNER_TEMP}/worker-image.json"
          docker buildx imagetools inspect \
            "${FUNCTION_RUNTIME_IMAGE}:${RELEASE_REVISION}" \
            --format '{{json .}}' > "${RUNNER_TEMP}/function-runtime-image.json"

      - name: Verify pair labels
        shell: bash
        run: |
          set -euo pipefail

          bun tools/devkit/src/runtime-image-pair.ts verify \
            --revision "${RELEASE_REVISION}" \
            --protocol-version "${{ needs.inspect_existing.outputs.protocol_version }}" \
            --control-plane-ref "${CONTROL_PLANE_IMAGE}:${RELEASE_REVISION}" \
            --control-plane-metadata "${RUNNER_TEMP}/control-plane-image.json" \
            --worker-ref "${WORKER_IMAGE}:${RELEASE_REVISION}" \
            --worker-metadata "${RUNNER_TEMP}/worker-image.json" \
            --function-runtime-ref "${FUNCTION_RUNTIME_IMAGE}:${RELEASE_REVISION}" \
            --function-runtime-metadata "${RUNNER_TEMP}/function-runtime-image.json"

      - name: Publish latest RuntimeFabric image pair
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          RELEASE_USES_CANARY: ${{ needs.inspect_existing.outputs.release_uses_canary }}
        run: |
          set -euo pipefail

          moving_tag="${LATEST_TAG}"
          if [[ "${RELEASE_USES_CANARY}" == "true" ]]; then
            moving_tag="canary"
          fi

          docker buildx imagetools create \
            --tag "${CONTROL_PLANE_IMAGE}:${moving_tag}" \
            "${CONTROL_PLANE_IMAGE}:${RELEASE_REVISION}"
          docker buildx imagetools create \
            --tag "${WORKER_IMAGE}:${moving_tag}" \
            "${WORKER_IMAGE}:${RELEASE_REVISION}"

          docker buildx imagetools create \
            --tag "${FUNCTION_RUNTIME_IMAGE}:${moving_tag}" \
            "${FUNCTION_RUNTIME_IMAGE}:${RELEASE_REVISION}"

          docker buildx imagetools inspect "${FUNCTION_RUNTIME_IMAGE}:${moving_tag}"
          docker buildx imagetools inspect "${CONTROL_PLANE_IMAGE}:${moving_tag}"
          docker buildx imagetools inspect "${WORKER_IMAGE}:${moving_tag}"

  publish_release:
    name: Publish versioned RuntimeFabric images and GitHub Release
    needs:
      - inspect_existing
      - verify_pair
    # A manual dispatch on main publishes too: a changelog-only release
    # promotion is not admitted by `release_gate`, and the immutable-version
    # check still rejects any attempt to re-release an existing version.
    if: ${{ !cancelled() && needs.inspect_existing.result == 'success' && needs.verify_pair.result == 'success' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.inspect_existing.outputs.release_version }}
      RELEASE_TAG: v${{ needs.inspect_existing.outputs.release_version }}
      RELEASE_IS_PRERELEASE: ${{ needs.inspect_existing.outputs.release_is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REVISION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and verify release notes
        shell: bash
        run: |
          set -euo pipefail

          extracted_version="$(
            bun tools/devkit/src/changelog-release.ts \
              extract CHANGELOG.md "${RUNNER_TEMP}/release-notes.md"
          )"
          if [[ "${extracted_version}" != "${RELEASE_VERSION}" ]]; then
            echo "The release version changed after image inspection" >&2
            exit 1
          fi

      - name: Reject conflicting Git tag or Release
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          tag_exists=false
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha' 2>/dev/null)" || tag_sha=""
          if [[ -n "${tag_sha}" ]]; then
            tag_exists=true
            if [[ "${tag_sha}" != "${RELEASE_REVISION}" ]]; then
              echo "Git tag ${RELEASE_TAG} already points to ${tag_sha}, not ${RELEASE_REVISION}" >&2
              exit 1
            fi
          fi

          release_exists=false
          if gh release view "${RELEASE_TAG}" --json body,isDraft,isPrerelease,name > "${RUNNER_TEMP}/existing-release.json" 2>/dev/null; then
            release_exists=true
            existing_body="$(jq -r '.body' "${RUNNER_TEMP}/existing-release.json")"
            expected_body="$(<"${RUNNER_TEMP}/release-notes.md")"
            if [[ "${existing_body}" != "${expected_body}" ]]; then
              echo "GitHub Release ${RELEASE_TAG} does not match CHANGELOG.md" >&2
              exit 1
            fi
            if [[ "$(jq -r '.name' "${RUNNER_TEMP}/existing-release.json")" != "Version ${RELEASE_VERSION}" ]]; then
              echo "GitHub Release ${RELEASE_TAG} has an unexpected title" >&2
              exit 1
            fi
            if [[ "$(jq -r '.isDraft' "${RUNNER_TEMP}/existing-release.json")" != "false" ]]; then
              echo "GitHub Release ${RELEASE_TAG} must be a published release, not a draft" >&2
              exit 1
            fi
            if [[ "$(jq -r '.isPrerelease' "${RUNNER_TEMP}/existing-release.json")" != "${RELEASE_IS_PRERELEASE}" ]]; then
              echo "GitHub Release ${RELEASE_TAG} pre-release status does not match the changelog version" >&2
              exit 1
            fi
          fi

          echo "tag_exists=${tag_exists}" >> "${GITHUB_OUTPUT}"
          echo "release_exists=${release_exists}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable version image tags
        shell: bash
        run: |
          set -euo pipefail

          publish_version_tag() {
            local image="$1"
            local source_ref="${image}:${RELEASE_REVISION}"
            local target_ref="${image}:${RELEASE_VERSION}"
            local source_metadata source_digest target_metadata target_digest

            source_metadata="$(docker buildx imagetools inspect "${source_ref}" --format '{{json .}}')"
            source_digest="$(jq -r '.manifest.digest // empty' <<<"${source_metadata}")"
            if [[ ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Image ${source_ref} has no multi-platform digest" >&2
              exit 1
            fi

            if target_metadata="$(docker buildx imagetools inspect "${target_ref}" --format '{{json .}}' 2>/dev/null)"; then
              target_digest="$(jq -r '.manifest.digest // empty' <<<"${target_metadata}")"
              if [[ "${target_digest}" != "${source_digest}" ]]; then
                echo "Image tag ${target_ref} already points to ${target_digest}, not ${source_digest}" >&2
                exit 1
              fi
              echo "Reusing immutable image tag ${target_ref}"
            else
              docker buildx imagetools create \
                --tag "${target_ref}" \
                "${image}@${source_digest}"
            fi

            target_metadata="$(docker buildx imagetools inspect "${target_ref}" --format '{{json .}}')"
            target_digest="$(jq -r '.manifest.digest // empty' <<<"${target_metadata}")"
            if [[ "${target_digest}" != "${source_digest}" ]]; then
              echo "Image tag ${target_ref} did not resolve to ${source_digest}" >&2
              exit 1
            fi
          }

          publish_version_tag "${CONTROL_PLANE_IMAGE}"
          publish_version_tag "${WORKER_IMAGE}"
          publish_version_tag "${FUNCTION_RUNTIME_IMAGE}"

      - name: Create GitHub Release
        if: ${{ steps.existing.outputs.release_exists != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          tag_option=(--target "${RELEASE_REVISION}")
          if [[ "${{ steps.existing.outputs.tag_exists }}" == "true" ]]; then
            tag_option=(--verify-tag)
          fi

          channel_option=(--latest)
          if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
            channel_option=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            "${tag_option[@]}" \
            --title "Version ${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${channel_option[@]}"
