name: Repository checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Pushes to `main`
# call this workflow from `runtime-images.yml`, and every one of them runs to
# completion before a release.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change that touches only documentation skips the checks below. The
  # workflow still runs, and `checks-passed` reports a result, so a required
  # status check never waits for a workflow that a path filter did not start.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      frontend_browser: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend_browser == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' }}
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!**/README*.md'
              - '!**/SPEC.md'
              - '!**/AGENTS.md'
              - '!**/CLAUDE.md'
              - '!**/CHANGELOG*.md'
              - '!LICENSE'
            frontend_browser:
              # The code filter needs "every" for its exclusions. Match these alternatives in one glob.
              - '{libs/{ankole-editor,uikit,applet-sdk},app/{locales,webapps,kernel/{spreadsheet*,word*,presentation*}}}/**'

  bun-static:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository != job.workflow_repository && (job.workflow_sha || github.sha) || '' }}
          persist-credentials: ${{ github.repository == job.workflow_repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint:repo
      - run: bun run fmt:check:repo
      - run: bun run analyze
      - run: bun run type-check --filter='!@ankole/control-plane'
      - run: bun run --filter @ankole/applet-sdk test
      - run: bun run --filter @ankole/block-editor test
      - run: bun run --filter @ankole/block-editor test:upstream
      - run: bun run agent-computer:test

  kernel-lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository != job.workflow_repository && (job.workflow_sha || github.sha) || '' }}
          persist-credentials: ${{ github.repository == job.workflow_repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - run: rustup default 1.99.1
      # Pull requests restore the cache that `main` saves and do not save their
      # own copy, which would crowd the repository's 10 GB cache quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/kernel -> target/clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun run --filter @ankole/kernel lint
      - run: cargo test --manifest-path app/kernel/Cargo.toml --lib

  # Formatting, warnings, Credo, and compile-cycle checks read compiled modules
  # only. `ANKOLE_KERNEL_SKIP_NIF` compiles the kernel module without building
  # its crate, and `kernel-lint` already runs Clippy on the NIF features, so
  # this job needs no Rust toolchain.
  control-plane-static:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # GitHub assigns reusable workflow jobs using the caller's runner access.
    runs-on: ${{ github.repository == 'AgentBull/infra' && 'eks-ankole-amd64' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      MIX_ENV: test
      ANKOLE_EDITION: foss
      ANKOLE_KERNEL_SKIP_NIF: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository != job.workflow_repository && (job.workflow_sha || github.sha) || '' }}
          persist-credentials: ${{ github.repository == job.workflow_repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ runner.environment == 'self-hosted' }}
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      # Protox runs protoc when it compiles `Ankole.RuntimeFabric.Proto`. The
      # pinned release archive downloads in about a second.
      - name: Install protoc
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          echo "3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mix-cache
        with:
          path: |
            app/control_plane/deps
            app/control_plane/_build
          key: control-plane-static-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane/config/**') }}-${{ hashFiles('app/control_plane/mix.exs', 'app/control_plane/mix.lock', 'app/control_plane/patches/**', 'app/kernel/mix.exs', 'libs/*/mix.exs') }}
          restore-keys: |
            control-plane-static-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane/config/**') }}-
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: app/control_plane
      - run: bun run --filter @ankole/control-plane lint
      - run: mix i18n.check
        working-directory: app/control_plane
      - name: Install Helm
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          echo "ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP/helm/linux-amd64" >> "$GITHUB_PATH"
      - name: Lint Helm chart
        run: |
          helm lint tools/deploy/helm/ankole-agent
          helm template test-release tools/deploy/helm/ankole-agent >/dev/null
      - run: mix ankole.compile_cycles
        working-directory: app/control_plane
      - run: mix ankole.compile_cycles
        working-directory: app/control_plane
        env:
          MIX_ENV: prod
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.mix-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            app/control_plane/deps
            app/control_plane/_build
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}

  # Mix configuration loads the kernel NIF, so the generated-contract checks
  # need the library. A cache keyed on every kernel input restores it, and only
  # a kernel change builds it again.
  control-plane-contracts:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      ANKOLE_EDITION: foss
      DATABASE_URL: ecto://postgres:repository-checks-only@localhost:5432/postgres
    services:
      postgres:
        image: ghcr.io/agentbull/ankole-postgres-for-ankole@sha256:1772c33690ecc4bd1e202c7059afa884288c9f80e70263ede28946e036b0d4ed
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: repository-checks-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository != job.workflow_repository && (job.workflow_sha || github.sha) || '' }}
          persist-credentials: ${{ github.repository == job.workflow_repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - name: Install protoc
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          echo "3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nif-cache
        with:
          path: app/kernel/priv/native
          key: control-plane-nif-${{ runner.os }}-rust-1.99.1-${{ hashFiles('app/kernel/**', '!app/kernel/target/**', '!app/kernel/priv/**', '!app/kernel/dist/**', '!app/kernel/node_modules/**', '!app/kernel/_build/**', '!app/kernel/deps/**') }}
      - name: Use the cached kernel NIF
        if: ${{ steps.nif-cache.outputs.cache-hit == 'true' }}
        run: echo "ANKOLE_KERNEL_SKIP_NIF=1" >> "$GITHUB_ENV"
      - if: ${{ steps.nif-cache.outputs.cache-hit != 'true' }}
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ steps.nif-cache.outputs.cache-hit != 'true' }}
        with:
          workspaces: app/kernel -> target/nif-test
          shared-key: control-plane-nif
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mix-cache
        with:
          path: |
            app/control_plane/deps
            app/control_plane/_build
          key: control-plane-contracts-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane/config/**') }}-${{ hashFiles('app/control_plane/mix.exs', 'app/control_plane/mix.lock', 'app/control_plane/patches/**', 'app/kernel/mix.exs', 'libs/*/mix.exs') }}
          restore-keys: |
            control-plane-contracts-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane/config/**') }}-
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: app/control_plane
      # A restored build can hold a kernel module compiled without its crate.
      # Removing it makes Mix build the NIF when the cache above has no library.
      - if: ${{ steps.nif-cache.outputs.cache-hit != 'true' }}
        run: rm -rf app/control_plane/_build/${ANKOLE_EDITION}/test/lib/ankole_kernel
      - uses: ./.github/actions/postgres-client
      - run: mix ankole.schema.check
        working-directory: app/control_plane
      - run: mix ankole.openapi.check
        working-directory: app/control_plane
      - run: mix ankole.toolkits
        working-directory: app/control_plane
      - name: Verify generated browser SDKs
        run: |
          bun run --filter @ankole/webapps openapi:generate
          git diff --exit-code -- app/webapps/openapi app/webapps/common/api/generated app/webapps/pod/api/generated app/webapps/console/api/v2/generated app/webapps/console/api/v2-site/generated
          test -z "$(git ls-files --others --exclude-standard -- app/webapps/common/api/generated app/webapps/pod/api/generated app/webapps/console/api/v2/generated app/webapps/console/api/v2-site/generated)"
      - name: Run core high-ROI contract tests
        working-directory: app/control_plane
        run: |
          mix test \
            test/ankole/tenancy_guard_test.exs \
            test/ankole_web/json_api/router_test.exs \
            test/ankole_web/json_api/native_authorization_routes_test.exs \
            test/ankole_web/json_api/meta_ankole_test.exs \
            test/ankole/human_access_test.exs \
            test/ankole/pod/read_concurrency_test.exs \
            test/ankole/connectors/gateway_return_test.exs \
            test/ankole/ai_gateway/responses_credential_retry_test.exs
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.nif-cache.outputs.cache-hit != 'true' }}
        with:
          path: app/kernel/priv/native
          key: ${{ steps.nif-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.mix-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            app/control_plane/deps
            app/control_plane/_build
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}

  # The editor's Playwright suite runs in two shards beside the webapps suites,
  # so the slowest leg, not the sum of the suites, sets the PR wait. Only the
  # webapps leg loads the kernel WASM.
  frontend-browser-fast:
    needs: changes
    if: ${{ needs.changes.outputs.frontend_browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: editor
            shard: 1/2
          - suite: editor
            shard: 2/2
          - suite: webapps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository != job.workflow_repository && (job.workflow_sha || github.sha) || '' }}
          persist-credentials: ${{ github.repository == job.workflow_repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.suite == 'webapps' }}
        id: wasm-cache
        with:
          path: app/kernel/dist
          key: frontend-browser-wasm-${{ runner.os }}-rust-1.99.1-${{ hashFiles('rust-toolchain.toml', 'app/kernel/Cargo.toml', 'app/kernel/Cargo.lock', 'app/kernel/spreadsheet*/**', 'app/kernel/word*/**', 'app/kernel/presentation*/**', 'app/kernel/vendor/**') }}
      - if: ${{ matrix.suite == 'webapps' && steps.wasm-cache.outputs.cache-hit != 'true' }}
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ matrix.suite == 'webapps' && steps.wasm-cache.outputs.cache-hit != 'true' }}
        with:
          workspaces: app/kernel -> target/wasm-build
          cache-directories: app/kernel/target/wasm-tools
          shared-key: frontend-browser-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ matrix.suite == 'webapps' && steps.wasm-cache.outputs.cache-hit != 'true' }}
        run: bun run --filter @ankole/kernel build:wasm
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.suite == 'webapps' && github.ref == 'refs/heads/main' && steps.wasm-cache.outputs.cache-hit != 'true' }}
        with:
          path: app/kernel/dist
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}
      - if: ${{ matrix.suite == 'webapps' }}
        run: bun run --filter @ankole/webapps test
      # Downloading Chromium from Playwright's CDN has taken up to seven minutes,
      # and the Ubuntu mirror that runners in AWS use has taken five minutes for
      # Chromium's system packages. The cache keeps both, keyed by the runner
      # image so that packages follow the image's package versions.
      - name: Read the Playwright version and runner image
        id: playwright
        working-directory: app/webapps
        run: |
          echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-chromium-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      # apt-get installs a package from its archive directory when the file
      # matches the package index, so restored packages skip the mirror.
      - name: Install Chromium and its system packages
        working-directory: app/webapps
        run: |
          mkdir -p ~/.cache/playwright-apt
          find ~/.cache/playwright-apt -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
          bunx playwright install --with-deps chromium
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.suite == 'webapps' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - if: ${{ matrix.suite == 'editor' }}
        run: bunx playwright test --project=chromium --shard="$SHARD"
        working-directory: libs/ankole-editor
        env:
          SHARD: ${{ matrix.shard }}
      - if: ${{ matrix.suite == 'webapps' }}
        run: bun run --filter @ankole/webapps test:browser

  # Require this job, not the individual checks, in branch protection. It
  # reports success when every check passed or a documentation-only change
  # skipped them.
  checks-passed:
    name: Repository checks passed
    needs: [changes, bun-static, kernel-lint, control-plane-static, control-plane-contracts, frontend-browser-fast]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required check finished with: $RESULTS" >&2
              exit 1
            fi
          done
