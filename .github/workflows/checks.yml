name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint:repo
      - run: bun run fmt:check:repo
      - run: bun run analyze
      - run: bun run type-check --filter='!@ankole/control-plane'

  kernel-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/kernel
      - run: bun run --filter @ankole/kernel lint

  control-plane-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      ANKOLE_EDITION: foss
      TORQUE_BUILD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/kernel/target
            app/kernel/priv/native
          key: control-plane-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-rust-1.99.1-${{ hashFiles('app/kernel/Cargo.lock', 'app/kernel/Cargo.toml', 'app/kernel/src/**', 'app/kernel/proto/**', 'app/kernel/lib/**') }}
          restore-keys: |
            control-plane-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-rust-1.99.1-${{ hashFiles('app/kernel/Cargo.lock') }}-
            control-plane-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-rust-1.99.1-
      - uses: actions/cache@v6
        with:
          path: |
            app/control_plane/deps
            app/control_plane/_build
          key: control-plane-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane/config/**') }}-${{ hashFiles('app/control_plane/mix.exs', 'app/control_plane/mix.lock', 'app/control_plane/patches/**', 'app/kernel/mix.exs', 'libs/*/mix.exs') }}
          restore-keys: |
            control-plane-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane/config/**') }}-
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: app/control_plane
      - run: bun run --filter @ankole/control-plane lint
      - run: mix ankole.compile_cycles
        working-directory: app/control_plane
      - run: mix ankole.compile_cycles
        working-directory: app/control_plane
        env:
          MIX_ENV: prod
      - run: mix ankole.openapi.check
        working-directory: app/control_plane
      - name: Verify generated browser SDKs
        run: |
          bun run --filter @ankole/webapps openapi:generate
          git diff --exit-code -- app/webapps/openapi app/webapps/common/api/generated app/webapps/pod/api/generated app/webapps/console/api/v2/generated app/webapps/console/api/v2-site/generated
          test -z "$(git ls-files --others --exclude-standard -- app/webapps/common/api/generated app/webapps/pod/api/generated app/webapps/console/api/v2/generated app/webapps/console/api/v2-site/generated)"
