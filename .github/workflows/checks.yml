name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run analyze
      - run: bun run --filter @ankole/webapps type-check
      - run: bun run --filter @ankole/webapps test
      - run: bun run --filter @ankole/applet-sdk type-check
      - run: bun run --filter @ankole/applet-sdk test

  repo-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint:repo
      - run: bun run fmt:check:repo

  agent-computer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run agent-computer:type-check
      # The host unit suite needs Bash, GNU timeout, and Python 3; the Ubuntu
      # runner image has all three.
      - run: bun run agent-computer:test

  libs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run --filter @ankole/uikit type-check
      - run: bun run --filter @ankole/uikit test
      - run: bun run --filter @agentbull/devkit type-check
      - run: bun run --filter @agentbull/devkit test

  page-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup default 1.98.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/kernel/target
          key: page-codec-cargo-${{ runner.os }}-rust-1.98.1-${{ hashFiles('app/kernel/Cargo.lock', 'app/kernel/Cargo.toml', 'app/kernel/build.rs', 'app/kernel/src/**', 'app/kernel/proto/**') }}
          restore-keys: |
            page-codec-cargo-${{ runner.os }}-rust-1.98.1-${{ hashFiles('app/kernel/Cargo.lock') }}-
            page-codec-cargo-${{ runner.os }}-rust-1.98.1-
      - run: bun run --filter @ankole/block-editor type-check
      - run: bun run --filter @ankole/block-editor test
      - run: cargo test --locked --manifest-path app/kernel/Cargo.toml --no-default-features page_document
      - run: bun run --filter @ankole/block-editor test:rust
      - run: bun run --filter @ankole/kernel test:node
      # Reuses the Node-API addon that test:node built. The Playwright snapshot
      # tests skip when ANKOLE_BROWSER_TEST_CHROMIUM names no browser.
      - run: bun run --filter @ankole/browser type-check
      - run: bun run --filter @ankole/browser test

  kernel-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/kernel
      - run: bun run --filter @ankole/kernel lint
      - run: bun run --filter @ankole/kernel test:rust

  mix-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - plugins/lark_adapter
          - plugins/dingtalk_adapter
          - plugins/wecom_adapter
          - plugins/slack_adapter
          - plugins/microsoft365_adapter
          - plugins/google_workspace_adapter
          - libs/im_transport
          - libs/feishu_protocol
          - tools/fake-feishu
          - app/kernel
    env:
      MIX_ENV: test
      ANKOLE_EDITION: foss
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup default 1.98.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/kernel/target
            app/kernel/priv/native
          key: mix-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-${{ env.MIX_ENV }}-rust-1.98.1-${{ hashFiles('app/kernel/Cargo.lock', 'app/kernel/Cargo.toml', 'app/kernel/src/**', 'app/kernel/proto/**', 'app/kernel/lib/**') }}
          restore-keys: |
            mix-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-${{ env.MIX_ENV }}-rust-1.98.1-${{ hashFiles('app/kernel/Cargo.lock') }}-
            mix-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-${{ env.MIX_ENV }}-rust-1.98.1-
      - uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: mix-build-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-${{ env.MIX_ENV }}-otp-29-elixir-1.20.4-${{ matrix.project }}-${{ hashFiles(format('{0}/mix.exs', matrix.project), format('{0}/mix.lock', matrix.project), 'app/control_plane_core/mix.exs', 'app/control_plane_core/patches/**', 'app/kernel/mix.exs') }}
          restore-keys: |
            mix-build-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-${{ env.MIX_ENV }}-otp-29-elixir-1.20.4-${{ matrix.project }}-
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
      - run: mix test

  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ci
      ANKOLE_EDITION: foss
      ANKOLE_SECRET_BASE: repository-checks-only
      DATABASE_URL: ecto://postgres:repository-checks-only@localhost:5432/ankole_test
    services:
      postgres:
        image: ghcr.io/agentbull/ankole-postgres-for-ankole:main-latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: repository-checks-only
          POSTGRES_DB: ankole_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ankole_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup default 1.98.1
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/kernel/target
            app/kernel/priv/native
          key: control-plane-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-rust-1.98.1-${{ hashFiles('app/kernel/Cargo.lock', 'app/kernel/Cargo.toml', 'app/kernel/src/**', 'app/kernel/proto/**', 'app/kernel/lib/**') }}
          restore-keys: |
            control-plane-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-rust-1.98.1-${{ hashFiles('app/kernel/Cargo.lock') }}-
            control-plane-cargo-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-rust-1.98.1-
      - uses: actions/cache@v6
        with:
          path: |
            app/control_plane/deps
            app/control_plane/_build
          key: control-plane-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane_core/config/**') }}-${{ hashFiles('app/control_plane/mix.exs', 'app/control_plane/mix.lock', 'app/control_plane_core/mix.exs', 'app/control_plane_core/patches/**', 'app/kernel/mix.exs', 'plugins/*/mix.exs', 'libs/*/mix.exs') }}
          restore-keys: |
            control-plane-mix-${{ runner.os }}-${{ env.ANKOLE_EDITION }}-otp-29-elixir-1.20.4-${{ hashFiles('app/control_plane_core/config/**') }}-
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: app/control_plane
      - run: bun run --filter @ankole/control-plane lint
      - run: mix ankole.compile_cycles
        working-directory: app/control_plane
      - run: mix ankole.compile_cycles
        working-directory: app/control_plane
        env:
          MIX_ENV: prod
      - run: mix ankole.openapi.check
        working-directory: app/control_plane
      - run: mix test
        working-directory: app/control_plane
      - run: mix test integration/subtraction_upgrade_test.exs integration/fake_feishu_standalone_e2e_test.exs
        working-directory: app/control_plane
